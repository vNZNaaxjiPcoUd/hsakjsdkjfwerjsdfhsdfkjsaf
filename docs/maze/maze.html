<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>終極文字迷宮</title>

<link rel="manifest" href="mazemanifest.json">
<meta name="theme-color" content="#121212">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
    body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: "Courier New", Courier, monospace;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100dvh; 
        overscroll-behavior: none;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
    }

    #header {
        text-align: center;
        margin-bottom: 5px;
        width: 100%;
        flex-shrink: 0;
    }
    h1 { margin: 10px 0 5px 0; font-size: 20px; color: #ffffff; }
    
    .stats-container {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .stat-badge {
        background-color: #333;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        color: #4CAF50;
        border: 1px solid #4CAF50;
    }
    .gem-badge { color: #FFEB3B; border-color: #FFEB3B; }

    #maze-wrapper {
        padding: 10px;
        background-color: #1a1a1a;
        border: 3px solid #4CAF50;
        border-radius: 12px;
        margin-bottom: 10px;
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #maze-container {
        display: grid;
        gap: 0; 
        background-color: #000;
    }
    
    .cell {
        width: 18px; 
        height: 18px; 
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: bold;
        line-height: 1;
    }

    .wall { color: #2E7D32; } 
    .path { color: transparent; }
    .player { 
        color: #FFFFFF; 
        background-color: #FF5722; 
        border-radius: 4px; 
        box-shadow: 0 0 5px #FF5722;
        z-index: 2;
    }
    .goal { color: #FFEB3B; animation: blink 1s infinite; }
    .gem { color: #00BCD4; font-size: 14px; } /* 寶物顏色 */
    .fog { background-color: #000000; color: transparent; }

    @keyframes blink { 50% { opacity: 0.4; } }

    #controls {
        display: grid;
        grid-template-columns: repeat(3, 80px);
        grid-template-rows: repeat(3, 60px);
        gap: 8px;
        flex-shrink: 0;
    }
    .btn {
        background-color: #2a2a2a;
        color: #bbb;
        border: 2px solid #444;
        border-radius: 12px;
        font-size: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }
    .btn:active { background-color: #4CAF50; color: white; border-color: #4CAF50; }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-reset { grid-column: 2; grid-row: 2; font-size: 14px; background-color: #4a2c2c; color: #ffcccc; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 3; }

    @media (hover: hover) and (pointer: fine) { #controls { display: none; } }
</style>
</head>
<body>

<div id="header">
    <h1>終極文字迷宮</h1>
    <div class="stats-container">
        <div class="stat-badge">第 <span id="level-display">1</span> 關</div>
        <div class="stat-badge">已通關: <span id="cleared-display">0</span></div>
        <div class="stat-badge gem-badge">剩餘 ✨: <span id="gem-display">0</span></div>
    </div>
</div>

<div id="maze-wrapper">
    <div id="maze-container"></div>
</div>

<div id="controls">
    <button class="btn" id="btn-up">▲</button>
    <button class="btn" id="btn-left">◄</button>
    <button class="btn" id="btn-reset">重置</button>
    <button class="btn" id="btn-right">►</button>
    <button class="btn" id="btn-down">▼</button>
</div>

<script>
    const mazeContainer = document.getElementById('maze-container');
    const levelDisplay = document.getElementById('level-display');
    const clearedDisplay = document.getElementById('cleared-display');
    const gemDisplay = document.getElementById('gem-display');
    const controls = document.getElementById('controls');

    let maze = [], gridCells = [], gems = [];
    let playerPos = { r: 1, c: 1 }, goalPos = { r: 1, c: 1 };
    let level = 1, rows = 15, cols = 15;
    const CELL_SIZE = 18; 

    // --- DB 邏輯略 (保持不變) ---
    const DB_NAME = 'MazeGameDB', STORE_NAME = 'gameState';
    let db;
    function initDB() { return new Promise((res, rej) => { const req = indexedDB.open(DB_NAME, 1); req.onsuccess = e => { db = e.target.result; res(db); }; req.onupgradeneeded = e => { db = e.target.result; db.createObjectStore(STORE_NAME); }; }); }
    function saveLevelData(lv) { if (db) db.transaction([STORE_NAME], 'readwrite').objectStore(STORE_NAME).put(lv, 'savedLevel'); }
    function loadLevelData() { return new Promise(res => { if (!db) return res(1); const req = db.transaction([STORE_NAME], 'readonly').objectStore(STORE_NAME).get('savedLevel'); req.onsuccess = e => res(e.target.result || 1); }); }

    function calculateDimensions() {
        const isControlsVisible = window.getComputedStyle(controls).display !== 'none';
        const reservedHeight = isControlsVisible ? 320 : 120; 
        const vW = window.visualViewport ? window.visualViewport.width : window.innerWidth;
        const vH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        let c = Math.floor((vW - 40) / CELL_SIZE);
        let r = Math.floor((vH - reservedHeight) / CELL_SIZE);
        if (c % 2 === 0) c--; if (r % 2 === 0) r--;
        cols = Math.max(11, c); rows = Math.max(11, r);
    }

    function generateMaze() {
        maze = Array.from({ length: rows }, () => Array(cols).fill(1));
        let branchProbability = Math.min(0.75, (level - 1) * 0.04);
        let activeCells = [{ r: 1, c: 1 }], pathCells = [];
        maze[1][1] = 0;

        while (activeCells.length > 0) {
            let index = (Math.random() < branchProbability) ? Math.floor(Math.random() * activeCells.length) : activeCells.length - 1;
            let cell = activeCells[index], neighbors = [];
            const directions = [[0, 2], [2, 0], [0, -2], [-2, 0]];
            for (let [dr, dc] of directions) {
                let nr = cell.r + dr, nc = cell.c + dc;
                if (nr > 0 && nr < rows - 1 && nc > 0 && nc < cols - 1 && maze[nr][nc] === 1) neighbors.push({ r: nr, c: nc, dr: dr, dc: dc });
            }
            if (neighbors.length > 0) {
                let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                maze[cell.r + next.dr / 2][cell.c + next.dc / 2] = 0; 
                maze[next.r][next.c] = 0; 
                activeCells.push({ r: next.r, c: next.c });
            } else {
                pathCells.push(activeCells.splice(index, 1)[0]);
            }
        }
        playerPos = { r: 1, c: 1 };
        goalPos = { r: rows - 2, c: cols - 2 };
        maze[goalPos.r][goalPos.c] = 0; 

        // --- 放置寶物點 ---
        gems = [];
        // 根據迷宮大小決定數量 (約每 50-70 格放一個寶物)
        let gemCount = Math.floor((rows * cols) / 60);
        // 過濾掉起點和終點
        let candidateCells = pathCells.filter(p => !(p.r === 1 && p.c === 1) && !(p.r === goalPos.r && p.c === goalPos.c));
        // 隨機選取寶物點
        for (let i = 0; i < gemCount && candidateCells.length > 0; i++) {
            let randIdx = Math.floor(Math.random() * candidateCells.length);
            gems.push(candidateCells.splice(randIdx, 1)[0]);
        }
    }

    function initGrid() {
        mazeContainer.style.gridTemplateColumns = `repeat(${cols}, ${CELL_SIZE}px)`;
        mazeContainer.style.gridTemplateRows = `repeat(${rows}, ${CELL_SIZE}px)`;
        mazeContainer.innerHTML = ''; gridCells = [];
        for (let r = 0; r < rows; r++) {
            let rowCells = [];
            for (let c = 0; c < cols; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                mazeContainer.appendChild(cell);
                rowCells.push(cell);
            }
            gridCells.push(rowCells);
        }
    }

    function drawMaze() {
        let visibilityRadius = 999;
        if (level >= 20) {
            let startingRadius = Math.min(rows, cols);
            visibilityRadius = Math.max(1, startingRadius - (level - 20));
        }

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let cell = gridCells[r][c];
                let dist = Math.max(Math.abs(r - playerPos.r), Math.abs(c - playerPos.c));
                if (dist > visibilityRadius) {
                    cell.className = 'cell fog'; cell.textContent = ' '; continue; 
                }
                if (r === playerPos.r && c === playerPos.c) {
                    cell.className = 'cell player'; cell.textContent = '＠'; 
                } else if (r === goalPos.r && c === goalPos.c) {
                    cell.className = 'cell goal'; cell.textContent = '★'; 
                } else {
                    let gem = gems.find(g => g.r === r && g.c === c);
                    if (gem) {
                        cell.className = 'cell gem'; cell.textContent = '✨';
                    } else if (maze[r][c] === 1) {
                        cell.className = 'cell wall'; cell.textContent = '█';   
                    } else {
                        cell.className = 'cell path'; cell.textContent = ' ';
                    }
                }
            }
        }
        levelDisplay.textContent = level;
        clearedDisplay.textContent = level - 1;
        gemDisplay.textContent = gems.length;
    }

    function movePlayer(dr, dc) {
        let moved = false;
        while (true) {
            let nextR = playerPos.r + dr, nextC = playerPos.c + dc;
            if (!maze[nextR] || maze[nextR][nextC] !== 0) break;
            playerPos.r = nextR; playerPos.c = nextC; moved = true;
            
            // 檢查是否吃到寶物
            let gemIdx = gems.findIndex(g => g.r === playerPos.r && g.c === playerPos.c);
            if (gemIdx !== -1) {
                gems.splice(gemIdx, 1); // 移除寶物
                // 吃到寶物不一定要停下，為了爽快感，繼續滑動
            }

            if (playerPos.r === goalPos.r && playerPos.c === goalPos.c) break;
            let isIntersection = false;
            if (dr !== 0) { if (maze[playerPos.r][playerPos.c - 1] === 0 || maze[playerPos.r][playerPos.c + 1] === 0) isIntersection = true; }
            else if (dc !== 0) { if (maze[playerPos.r - 1][playerPos.c] === 0 || maze[playerPos.r + 1][playerPos.c] === 0) isIntersection = true; }
            if (isIntersection) break; 
        }
        if (moved) { drawMaze(); checkWin(); }
    }

    function checkWin() {
        if (playerPos.r === goalPos.r && playerPos.c === goalPos.c) {
            setTimeout(() => { level++; saveLevelData(level); startNewLevel(); }, 150);
        }
    }

    // --- 事件監聽略 (保持不變) ---
    window.addEventListener('keydown', (e) => { const code = e.code; if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", "Space"].includes(code)) e.preventDefault(); switch (code) { case 'ArrowUp': case 'KeyW': movePlayer(-1, 0); break; case 'ArrowDown': case 'KeyS': movePlayer(1, 0); break; case 'ArrowLeft': case 'KeyA': movePlayer(0, -1); break; case 'ArrowRight': case 'KeyD': movePlayer(0, 1); break; case 'KeyR': resetLevel(); break; } });
    function bindButton(id, action) { const btn = document.getElementById(id); if(!btn) return; btn.addEventListener('pointerdown', (e) => { e.preventDefault(); action(); }); }
    bindButton('btn-up', () => movePlayer(-1, 0)); bindButton('btn-down', () => movePlayer(1, 0)); bindButton('btn-left', () => movePlayer(0, -1)); bindButton('btn-right', () => movePlayer(0, 1)); bindButton('btn-reset', resetLevel);
    function resetLevel() { playerPos = { r: 1, c: 1 }; drawMaze(); }
    function startNewLevel() { calculateDimensions(); generateMaze(); initGrid(); drawMaze(); }
    async function initGame() { try { await initDB(); level = await loadLevelData(); } catch (err) { level = 1; } startNewLevel(); }
    initGame();
</script>
</body>
</html>
