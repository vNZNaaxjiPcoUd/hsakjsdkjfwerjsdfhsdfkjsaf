<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>終極文字迷宮</title>

<link rel="manifest" href="mazemanifest.json">
<meta name="theme-color" content="#121212">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
    body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: "Courier New", Courier, monospace;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100dvh; 
        overscroll-behavior: none;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
    }

    #header {
        text-align: center;
        margin-bottom: 5px;
        width: 100%;
        flex-shrink: 0;
    }
    h1 { margin: 10px 0 5px 0; font-size: 22px; color: #ffffff; }
    
    .stats-container {
        display: flex;
        justify-content: center;
        gap: 15px;
    }
    .stat-badge {
        background-color: #333;
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: bold;
        color: #4CAF50;
        border: 1px solid #4CAF50;
    }

    #maze-wrapper {
        padding: 10px;
        background-color: #1a1a1a;
        border: 3px solid #4CAF50;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        margin-bottom: 15px;
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #maze-container {
        display: grid;
        gap: 0; 
        background-color: #000;
    }
    
    .cell {
        width: 18px; 
        height: 18px; 
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: bold;
        line-height: 1;
    }

    /* 遊戲元素樣式 */
    .wall { color: #2E7D32; } 
    .path { color: transparent; }
    .player { 
        color: #FFFFFF; 
        background-color: #FF5722; 
        border-radius: 4px; 
        box-shadow: 0 0 5px #FF5722;
        z-index: 2;
    }
    .goal { 
        color: #FFEB3B; 
        animation: blink 1s infinite; 
    }
    
    /* 黑霧樣式 */
    .fog {
        background-color: #000000;
        color: transparent;
    }

    @keyframes blink { 50% { opacity: 0.4; } }

    #controls {
        display: grid;
        grid-template-columns: repeat(3, 80px);
        grid-template-rows: repeat(3, 60px);
        gap: 10px;
        flex-shrink: 0;
        margin-bottom: 10px;
    }
    .btn {
        background-color: #2a2a2a;
        color: #bbb;
        border: 2px solid #444;
        border-radius: 12px;
        font-size: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }
    .btn:active { 
        background-color: #4CAF50; 
        color: white;
        border-color: #4CAF50;
    }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-reset { 
        grid-column: 2; grid-row: 2; 
        font-size: 16px; 
        background-color: #4a2c2c; 
        border-color: #663333;
        color: #ffcccc;
    }
    #btn-reset:active { background-color: #884444; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 3; }

    /* --- 平板/電腦判斷核心 --- */
    /* 只有在支援滑鼠懸停 (hover) 且具備精確指標 (pointer: fine) 的電腦上，才隱藏按鍵 */
    @media (hover: hover) and (pointer: fine) {
        #controls { display: none; }
    }
</style>
</head>
<body>

<div id="header">
    <h1>終極文字迷宮</h1>
    <div class="stats-container">
        <div class="stat-badge">第 <span id="level-display">1</span> 關</div>
        <div class="stat-badge">已過關: <span id="cleared-display">0</span></div>
    </div>
</div>

<div id="maze-wrapper">
    <div id="maze-container"></div>
</div>

<div id="controls">
    <button class="btn" id="btn-up">▲</button>
    <button class="btn" id="btn-left">◄</button>
    <button class="btn" id="btn-reset">重置</button>
    <button class="btn" id="btn-right">►</button>
    <button class="btn" id="btn-down">▼</button>
</div>

<script>
    const mazeContainer = document.getElementById('maze-container');
    const levelDisplay = document.getElementById('level-display');
    const clearedDisplay = document.getElementById('cleared-display');
    const controls = document.getElementById('controls');

    let maze = [], gridCells = [];
    let playerPos = { r: 1, c: 1 }, goalPos = { r: 1, c: 1 };
    let level = 1;
    let rows = 15, cols = 15;
    const CELL_SIZE = 18; 

    const DB_NAME = 'MazeGameDB';
    const STORE_NAME = 'gameState';
    let db;

    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onerror = event => reject("IndexedDB error: " + event.target.errorCode);
            request.onsuccess = event => { db = event.target.result; resolve(db); };
            request.onupgradeneeded = event => {
                db = event.target.result;
                db.createObjectStore(STORE_NAME);
            };
        });
    }

    function saveLevelData(currentLevel) {
        if (!db) return;
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        store.put(currentLevel, 'savedLevel');
    }

    function loadLevelData() {
        return new Promise(resolve => {
            if (!db) return resolve(1);
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.get('savedLevel');
            request.onsuccess = event => resolve(event.target.result || 1);
            request.onerror = () => resolve(1);
        });
    }
