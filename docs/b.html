<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <base target="_blank">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Show</title>
    <style>
    body {
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        color: #f0f0f0;
        background-color: #000000;
    }
    a, a.visited {
        color: inherit;
        text-decoration: none;
    }
    .control-group { 
        margin-top: 15px; 
        padding: 10px; 
        background: #222; 
        border-radius: 8px; 
    }
    h4 { margin: 0 0 10px 0; color: #fff; }
    button { 
        padding: 8px 12px; 
        font-size: 16px; 
        margin: 0 5px 8px 0; 
        cursor: pointer; 
        border: none;
        border-radius: 4px;
        background-color: #444;
        color: white;
    }
    button:active { background-color: #666; }
    </style>
</head>
<body>
<div id="secretArea"><div id="allT">.</div></div>
<div id="otherInfo">
</div>

    <div class="control-group">
        <h4>⏩ Playback Speed</h4>
        <button onclick="setSpeed(0.5)">0.5x</button>
        <button onclick="setSpeed(0.6)">0.6x</button>
        <button onclick="setSpeed(0.7)">0.7x</button>
        <button onclick="setSpeed(0.75)">0.75x</button>
        <button onclick="setSpeed(0.8)">0.8x</button>
        <button onclick="setSpeed(0.9)">0.9x</button>
        <button onclick="setSpeed(1)">1x</button>
        <button onclick="setSpeed(1.5)">1.5x</button>
    </div>

    <div class="control-group">
        <h4>⏯ Playback Controls</h4>
        <button onclick="player && player.playVideo()">Play</button>
        <button onclick="player && player.pauseVideo()">Pause</button>
        <button onclick="player && player.stopVideo()">Stop</button>
    </div>

    <div class="control-group">
        <h4>⏳ Skip / Rewind</h4>
        <button onclick="seekVideo(-30)">⏪ -30s</button>
        <button onclick="seekVideo(-10)">⏪ -10s</button>
        <button onclick="seekVideo(10)">+10s ⏩</button>
        <button onclick="seekVideo(30)">+30s ⏩</button>
    </div>

    <div class="control-group">
        <h4>🔊 Audio Controls</h4>
        <button onclick="player && player.mute()">Mute</button>
        <button onclick="player && player.unMute()">Unmute</button>
    </div>

<div class="control-group" id="countdown">
<input type="number" id="minutes" placeholder="countdown minutes">
<button onclick="startTimer()">send</button>
</div>
<div class="control-group" id="uID"></div>
<div class="control-group" id="closeWindow">
    <button id="closeWindowBnt" onclick="window.close()">Close</button>
</div>

<script>
// iframe 原始碼 (加入 enablejsapi=1 & playsinline=1，ID 為 Plys)
const allText = `<iframe id="Plys" style="width:100%; height:100dvh; border:none; margin:0; padding:0; display:block;" 
src="https://www.youtube.com/embed/AAURL?loop=1&playlist=AAURL&autoplay=1&enablejsapi=1&playsinline=1" 
title="" frameborder="0" 
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;

let nowID = ""; 
var player; 
    
function getID(url) {
        const regex = /[?&]v=([A-Za-z0-9_-]{11})|youtu\.be\/([A-Za-z0-9_-]{11})|\/shorts\/([A-Za-z0-9_-]{11})/;
        const match = url.match(regex);
        return match ? (match[1] || match[2] || match[3]) : "no";
    }
    
function handleID(id){
        if(id.length > 11){
            id = getID(id);
        }
        if (id.length === 11){
            const updateURL = allText.replaceAll('AAURL',id);
            // 將 iframe 寫入網頁
            document.getElementById("allT").innerHTML = updateURL ;
            nUrl = "https://h.jwint.net/b?"+nowID;
            document.getElementById("uID").innerHTML = `<a href="${nUrl}">${id}</a>` ;
            
            // 注意：這裡移除了原本錯誤直接呼叫 initYouTubePlayer() 的邏輯
            
        }else {
            document.getElementById("allT").innerHTML = "Hello World" ;
            document.getElementById("otherInfo").style.display = "none";
        }   
        document.getElementById("secretArea").style.display = "block";
    }

function extractMiddle(str) {
        const prefix = "FsdGVkX19JAx6y6XDUsl0czQsdOahaolUSW";
        const suffix = "TiT62peYwEcQqvk4bBB7Kb5cBGVAW";
        
        if (str.startsWith(prefix) && str.endsWith(suffix)) {
            nowID = str;
            const middle = str.slice(prefix.length, -suffix.length);
            return middle;
        } else {
            console.log("nomatch");
            return "nomatch";
        }
    }

function checkUrlPara() {
        const lastPart = window.location.search.slice(1);
        if ( lastPart === ""){
            document.getElementById("allT").innerHTML = "hello!";
            document.getElementById("secretArea").style.display = "block";
            document.getElementById("otherInfo").style.display = "none";
        }else{
            const pID = extractMiddle(lastPart);
            handleID(pID);
        }
    }

// 執行網址檢查，這會同步把 iframe 塞進去 HTML 裡
checkUrlPara();

function startTimer() {
        const minutes = parseFloat(document.getElementById('minutes').value);
        if ( minutes === 0){
            window.location.href = "https://h.jwint.net/HelloWorld?"+nowID;
        }
        if (isNaN(minutes) || minutes <= 0) {
            alert('請輸入正數！');
            return;
        }
        document.getElementById('minutes').placeholder = "開始" + minutes;
        document.getElementById('minutes').value = "";
        const ms = minutes * 60 * 1000;
        setTimeout(() => {
            console.log('時間到了！');
            window.location.href = "https://h.jwint.net/HelloWorld?"+nowID;
        }, ms);
    }

// ----------------------------------------------------
// YouTube API 控制邏輯 (修正版)
// ----------------------------------------------------

// 當 YouTube API 腳本載入完成後，會自動呼叫這個函數
function onYouTubeIframeAPIReady() {
    console.log("YouTube API Loaded. Trying to bind to iframe...");
    // 檢查網頁裡是不是真的已經有 id 為 Plys 的 iframe
    if (document.getElementById('Plys')) {
        player = new YT.Player('Plys', {
            events: {
                'onReady': onPlayerReady
            }
        });
    } else {
        console.log("Error: Could not find iframe with id 'Plys'");
    }
}

function onPlayerReady(event) {
    console.log("Player is perfectly bound and ready!");
}

// 調整播放速度
function setSpeed(speed) {
    if(player && player.setPlaybackRate) {
        player.setPlaybackRate(speed);
    } else {
        console.log("Player is not ready yet.");
    }
}

// 調整進度
function seekVideo(seconds) {
    if(player && player.getCurrentTime) {
        var currentTime = player.getCurrentTime();
        player.seekTo(currentTime + seconds, true);
    }
}

</script>

<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
