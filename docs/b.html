<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>畫卷</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon192.png">
    <link rel="apple-touch-icon" href="./favicon192.png">
    <style>
    /* 基礎重置與 iPhone 最佳化 */
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 16px;
        color: #f0f0f0;
        background-color: #000000;
        margin: 0;
        padding: 0;
        overscroll-behavior-y: none; 
    }
    a, a.visited {
        color: inherit;
        text-decoration: none;
    }
    
    #secretArea {
        width: 100%;
        background: #000;
        position: sticky;
        top: 0;
        z-index: 10;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .controls-container {
        padding: 15px;
        padding-bottom: env(safe-area-inset-bottom);
    }

    .control-group { 
        margin-bottom: 15px; 
        padding: 15px; 
        background: #1c1c1e; 
        border-radius: 12px; 
    }
    h4 { 
        margin: 0 0 12px 0; 
        color: #fff; 
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .btn-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .btn-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .btn-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .btn-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

    button { 
        padding: 12px 5px; 
        font-size: 15px; 
        font-weight: 500;
        cursor: pointer; 
        border: none;
        border-radius: 8px;
        background-color: #333336;
        color: #fff;
        transition: background-color 0.1s;
        touch-action: manipulation;
    }
    button:active { background-color: #55555a; transform: scale(0.98); }

    .B1 {
        background-color: #070222;
    }

    /* 計時器專屬設計 */
    .timer-container {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
    }
    input[type="number"] {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #444;
        background: #000;
        color: #fff;
        font-size: 16px;
        outline: none;
    }
    input[type="number"]::placeholder { color: #888; }
    .timer-btn { padding: 12px 20px; background-color: #0A84FF; color: white; white-space: nowrap; }
    .timer-btn:active { background-color: #006ee6; }
    #timerDisplay { text-align: center; color: #FF9F0A; font-weight: bold; font-size: 16px; margin-top: 5px; }

    iframe {
        border: none;
        display: block;
        margin: 0 auto;
        width: 100%;
        max-width: 177.78vh;
        aspect-ratio: 16 / 9;
        max-height: 80dvh; 
        object-fit: contain;
    }
    </style>
</head>
<body>

<div id="secretArea"><div id="allT">.</div></div>

<div class="controls-container">
    
    <div class="control-group">
        <div class="btn-grid-5">
            <button class="B1" id="playBtn" onclick="playVideo(this)">暫停</button>
            <button class="B1" onclick="setSpeed(0.8)">.8x</button>
            <button class="B1" onclick="setSpeed(0.66)">.66x</button>
            <button class="B1" onclick="setSpeed(0.75)">.75x</button>
            <button class="B1" onclick="setSpeed(0.5)">.5x</button>
            <button onclick="seekVideo(-120)">⏪ 2m</button>
            <button onclick="seekVideo(-30)">⏪ 30S</button>
            <button onclick="seekVideo(30)">30S ⏩</button>
            <button onclick="seekVideo(120)">2m ⏩</button>
            <button onclick="seekVideo(300)">5m ⏩</button>
            <button class="B1" onclick="setSpeed(0.33)">.33x</button>
            <button class="B1" onclick="setSpeed(1)">1x</button>
            <button class="B1" onclick="setSpeed(1.5)">1.5x</button>
            <button class="B1" onclick="setSpeed(2)">2x</button>
            <button class="B1" onclick="setSpeed(3)">3x</button>
        </div>
    </div>

    <!-- 倒數計時區塊 -->
    <div class="control-group">
        <div class="timer-container">
            <input type="number" id="minutes" placeholder="輸入倒數分鐘數" min="0" step="0.1">
            <button class="timer-btn" onclick="startTimer()">開始倒數</button>
        </div>
        <div id="timerDisplay"></div>
    </div>

    <div class="control-group">
        <div class="btn-grid-2">
            <div id="uID" style="text-align:center; padding: 10px; background: transparent;"></div> 
            <button id="closeWindowBnt" onclick="window.close()" style="width: 100%; background-color: #FF453A;">關閉</button>
        </div>
    </div>
</div>
<script src="b.js"></script>
<script defer src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
