<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>畫卷</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon192.png">
    <link rel="apple-touch-icon" href="./favicon192.png">
    <style>
    /* 基礎重置與 iPhone 最佳化 */
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 16px;
        color: #f0f0f0;
        background-color: #000000;
        margin: 0;
        padding: 0;
        overscroll-behavior-y: none; 
    }
    a, a.visited {
        color: inherit;
        text-decoration: none;
    }
    
    #secretArea {
        width: 100%;
        background: #000;
        position: sticky;
        top: 0;
        z-index: 10;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .controls-container {
        padding: 15px;
        padding-bottom: env(safe-area-inset-bottom);
    }

    .control-group { 
        margin-bottom: 15px; 
        padding: 15px; 
        background: #1c1c1e; 
        border-radius: 12px; 
    }
    h4 { 
        margin: 0 0 12px 0; 
        color: #fff; 
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .btn-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .btn-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .btn-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .btn-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

    button { 
        padding: 12px 5px; 
        font-size: 15px; 
        font-weight: 500;
        cursor: pointer; 
        border: none;
        border-radius: 8px;
        background-color: #333336;
        color: #fff;
        transition: background-color 0.1s;
        touch-action: manipulation;
    }
    button:active { background-color: #55555a; transform: scale(0.98); }

    .B1 {
        background-color: #070222;
    }

    /* 計時器專屬設計 */
    .timer-container {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
    }
    input[type="number"] {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #444;
        background: #000;
        color: #fff;
        font-size: 16px;
        outline: none;
    }
    input[type="number"]::placeholder { color: #888; }
    .timer-btn { padding: 12px 20px; background-color: #0A84FF; color: white; white-space: nowrap; }
    .timer-btn:active { background-color: #006ee6; }
    #timerDisplay { text-align: center; color: #FF9F0A; font-weight: bold; font-size: 16px; margin-top: 5px; }

    iframe {
        border: none;
        display: block;
        margin: 0 auto;
        width: 100%;
        max-width: 177.78vh;
        aspect-ratio: 16 / 9;
        max-height: 80dvh; 
        object-fit: contain;
    }
    </style>
</head>
<body>

<div id="secretArea"><div id="allT">.</div></div>

<div class="controls-container">
    
    <div class="control-group">
        <div class="btn-grid-5">
            <button class="B1" onclick="player && player.playVideo()">播放</button>
            <button class="B1" onclick="setSpeed(1)">1x</button>
            <button class="B1" onclick="setSpeed(1.5)">1.5x</button>
            <button class="B1" onclick="setSpeed(2)">2x</button>
            <button class="B1" onclick="player && player.pauseVideo()">暫停</button>
            <button onclick="seekVideo(-120)">&lt;&lt;2m</button>
            <button onclick="seekVideo(-30)">&lt;&lt;30S</button>
            <button onclick="seekVideo(30)">30S&gt;&gt;</button>
            <button onclick="seekVideo(120)">2m&gt;&gt;</button>
            <button onclick="seekVideo(300)">5m&gt;&gt;</button>
            <button class="B1" onclick="setSpeed(0.33)">.33x</button>
            <button class="B1" onclick="setSpeed(0.5)">.5x</button>
            <button class="B1" onclick="setSpeed(0.66)">.66x</button>
            <button class="B1" onclick="setSpeed(0.75)">.75x</button>
            <button class="B1" onclick="setSpeed(0.8)">.8x</button>
        </div>
    </div>

    <!-- 倒數計時區塊 -->
    <div class="control-group">
        <div class="timer-container">
            <input type="number" id="minutes" placeholder="輸入倒數分鐘數" min="0" step="0.1">
            <button class="timer-btn" onclick="startTimer()">開始倒數</button>
        </div>
        <div id="timerDisplay"></div>
    </div>

    <div class="control-group">
        <div class="btn-grid-2">
            <div id="uID" style="text-align:center; padding: 10px; background: transparent;"></div> 
            <button id="closeWindowBnt" onclick="window.close()" style="width: 100%; background-color: #FF453A;">關閉</button>
        </div>
    </div>
</div>

<script>
const allText = `<iframe id="Plys" 
src="https://www.youtube.com/embed/AAURL?loop=0&playlist=AAURL&autoplay=1&enablejsapi=1&playsinline=1" 
title="" frameborder="0" 
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;

let nowID = ""; 
var player; 
let countdownInterval; 
    
function getID(url) {
    const regex = /[?&]v=([A-Za-z0-9_-]{11})|youtu\.be\/([A-Za-z0-9_-]{11})|\/shorts\/([A-Za-z0-9_-]{11})/;
    const match = url.match(regex);
    return match ? (match[1] || match[2] || match[3]) : "no";
}
    
function handleID(id){
    if(id.length > 11){
        id = getID(id);
    }
    if (id.length === 11){
        const updateURL = allText.replaceAll('AAURL',id);
        document.getElementById("allT").innerHTML = updateURL ;
        nUrl = "https://h.jwint.net/c?"+nowID;
        document.getElementById("uID").innerHTML = `<a href="${nUrl}" style="color: #0A84FF;">${id}</a>` ;
    } else {
        document.getElementById("allT").innerHTML = "<h3 style='padding:20px; text-align:center;'>Hello World</h3>" ;
    }   
}

function extractMiddle(str) {
    const prefix = "FsdGVkX19JAx6y6XDUsl0czQsdOahaolUSW";
    const suffix = "TiT62peYwEcQqvk4bBB7Kb5cBGVAW";
    
    if (str.startsWith(prefix) && str.endsWith(suffix)) {
        nowID = str;
        return str.slice(prefix.length, -suffix.length);
    } else {
        return "nomatch";
    }
}

function checkUrlPara() {
    const lastPart = window.location.search.slice(1);
    if (lastPart === ""){
        document.getElementById("allT").innerHTML = "<h3 style='padding:20px; text-align:center;'>hello world!</h3>";
    } else {
        const pID = extractMiddle(lastPart);
        handleID(pID);
    }
}

checkUrlPara();

// 更新為時間到停止播放的倒數計時功能
function startTimer() {
    const inputElement = document.getElementById('minutes');
    const minutes = parseFloat(inputElement.value);
    const displayElement = document.getElementById('timerDisplay');

    // 如果輸入 0，立即停止播放
    if (minutes === 0) {
        displayElement.innerText = "已停止播放";
        if (player && player.pauseVideo) {
            player.pauseVideo();
        }
        return;
    }
    if (isNaN(minutes) || minutes < 0) {
        alert('請輸入有效的正數分鐘！');
        return;
    }

    // 清除舊的計時器
    clearInterval(countdownInterval);
    
    let timeLeft = Math.floor(minutes * 60);
    inputElement.value = ""; 
    
    updateDisplay(timeLeft, displayElement);

    // 每秒更新
    countdownInterval = setInterval(() => {
        timeLeft--;
        updateDisplay(timeLeft, displayElement);
        
        if (timeLeft <= 0) {
            clearInterval(countdownInterval);
            displayElement.innerText = "時間到，已停止播放";
            // 執行時間到的動作：暫停影片
            if (player && player.pauseVideo) {
                player.pauseVideo();
            }
        }
    }, 1000);
}

function updateDisplay(totalSeconds, element) {
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    const formattedSeconds = s < 10 ? '0' + s : s;
    element.innerText = `將於 ${m}:${formattedSeconds} 後暫停播放`;
}

// ----------------------------------------------------
// YouTube API 邏輯
// ----------------------------------------------------
function onYouTubeIframeAPIReady() {
    if (document.getElementById('Plys')) {
        player = new YT.Player('Plys', {
            events: {
                'onReady': onPlayerReady
            }
        });
    }
}

function onPlayerReady(event) {}

function setSpeed(speed) {
    if(player && player.setPlaybackRate) {
        player.setPlaybackRate(speed);
    }
}

function seekVideo(seconds) {
    if(player && player.getCurrentTime) {
        var currentTime = player.getCurrentTime();
        player.seekTo(currentTime + seconds, true);
    }
}

function changeVolume(amount) {
    if (player && player.getVolume && player.setVolume) {
        let currentVol = player.getVolume();
        let newVol = currentVol + amount;
        
        if (newVol > 100) newVol = 100;
        if (newVol < 0) newVol = 0;
        
        if (player.isMuted()) {
            player.unMute();
        }
        
        player.setVolume(newVol);
    }
}
</script>

<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
