    <script>

// --- 全局變數 ---
const encryptedContentArea = document.getElementById('encryptedContent');
const API_URL = "https://script.google.com/macros/s/AKfycbzIAuTrBD3eI7uusVneoYF6P-f2RtqVLT2yrpHbWpghCTsfhGh6JdcMgKx2b6a3K7HX/exec"; 
const SALT = "Nxk98ahIR50AtZBiLxowpmhaWXQCg8E";

function updateStatus(message, type = 'info') {
}

function getKey(){
    return CryptoJS.SHA512(bookData.aesKey+"Sy8ai12PJ4EEX9DmHWabqZRCMJEInt1pQh").toString();
}

function decData(){
    let originalText = "";
    let ret = true;

        const key = getKey();
        const encryptedText = encryptedContentArea.value;
        if (!key || key.trim() === "") { alert("請輸入密鑰", 'error'); return false; }
        //console.log("開始解密...",encryptedText);
        if (!encryptedText) { console.log("無密文內容", 'error'); return false; }

        try {
            const keyHash = key;
            const bytes = CryptoJS.AES.decrypt(encryptedText, keyHash);
            originalText = bytes.toString(CryptoJS.enc.Utf8);
            if (originalText) {
                setContentToTabB(originalText);
            } else {
                console.log("解密錯誤，流程A");
                ret = false;
            }
            
        } catch (e) {
            console.log("解密發生錯誤。B", e);
            ret = false; 

        }
    return ret;
}



function generateToken() {
    const kNow = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    const name=bookData.Name;
    const rawString = bookData.APIKey + SALT + kNow + name;
    return CryptoJS.SHA512(rawString).toString();
} 

async function callApi(params) {
    const token = generateToken();

    // 組合 URL 參數
    const queryString = new URLSearchParams({
        ...params,
        token: token
    }).toString();
    const finalUrl = `${API_URL}?${queryString}`;
    try {
        const response = await fetch(finalUrl);
        const result = await response.json();
        return result;
    } catch (error) {
        console.error("API 請求失敗:");
        console.log(error);
        confirm("網路請求失敗，是否重試？");
        return { status: "error", message: "網路請求失敗" };
    }
}

async function doGet(key) {
    const res = await callApi({
        action: "get",
        key: key,
        value: "123456",
        tag:"AAAAAA"
    });
    let newRes = null;
    if(res.status === "success"){
        newRes = { status: res.status, message: res.message, key: res.key, value: res.value, tag: res.tag };
    } else {
        console.log("讀取資料失敗:", res.message);
        newRes = { status: res.status, message: res.message, key: null, value: null, tag: null };
    }
    return newRes;
}
function showError(){
        bookContent = ["你好! \n\n新的世界在你的腳下，***走一步***吧！"];
        showMarkdownView();
        return;
}
async function getFromAPI() {

    updateStatus("正在讀取...", 'info');
    if(!bookData.APIKey) {
        getAPIKey();
    } 

    let res = await doGet(bookData.Name);

    if (res.status === "success" && res.value) {

        encryptedContentArea.value = res.value;
        bookData.tag = res.tag || "";
        let ret = false;
        while(!ret) {
            while(!bookData.aesKey) {
                let ret = await getAESKey();
            }                
            ret = await decData();
            if (!ret) {
                console.log(`解密失敗，請確認 AES 密鑰是否正確`, 'error');
                cleanAESKey();
                await sleep(3000);    
            }else{

            }
        }
    } else {
        console.log(`API 讀取失敗: ${res.message}`, 'error');
        showError();
    }
    if (res.status === "success") {
        updateStatus("讀取成功", 'success');
    }else{
        updateStatus("讀取失敗: " + res.message, 'error');
        showError();
    }
    return res;
}


// Get API Key  
async function getAPIKey() {
    bookData.APIKey = "3d46431496b772599fcf959885ccdea155508431ed67819db3e41079fa2d8a3cd547f596ec7c9d0b5621d6c39549297ae90ba14c663d738ec07194ad9ddeab82"
    return;
    const apiKey = prompt("請輸入雲密碼:");
    if (apiKey) {
        bookData.APIKey = apiKey;
        updateStatus("雲密碼已更新", 'success');
    } else {
        updateStatus("雲密碼未更改", 'info');
    }
};

const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

async function getAESKey() {
    let aesKey =""; 
        aesKey = prompt("請輸入密碼:");
        if (aesKey) {
            bookData.aesKey = aesKey;
        } else if(aesKey === "") {
                bookData.aesKey = "";
            }else { //aseKey 為 null，使用者按了取消
                bookData.aesKey = "";
                await sleep(3000);
                return false;
            }
    return true;
}


let bookData = {
    Name: "",
    APIKey: "",
    aesKey: "",
    info: "這是一些額外的資訊",
    tag:"9999"
}

// clean aesKey
function cleanAESKey() {
    bookData.aesKey = "";
    
}
let btitle = null;
function addEditableBlock(title = "標題", text = "內容") {
    bookContent.push(text);
    if (!btitle) {
        btitle = title;
        document.title = btitle;
    }
}

function setContentToTabB(fullContent) {


    let parseType = "v2";
    let blockStrings = fullContent.split('<<<<BLOCK_START_v2>>>>').filter(s => s.trim() !== "");

    if (blockStrings.length === 0 || blockStrings[0].indexOf('<<<<TITLE_END>>>>') === -1) {   
        console.log("使用舊版解析方式...");
        const blockStrings2 = fullContent.split('<<<<BLOCK_START>>>>').filter(s => s.trim() !== "");
        console.log("org length:", fullContent.length, "blocks found:", blockStrings2.length);
        if (blockStrings2.length === 0) {
            console.log("解密內容", fullContent);
            return;
        }
        parseType = "v1";
        blockStrings = blockStrings2;
    }
    blockStrings.forEach(blockStr => {
        const regex = new RegExp(`(.*?)\n<<<<TITLE_END>>>>\n(.*?)<<<<BLOCK_END>>>>`, 's');
        const match = blockStr.match(regex);
        //console.log(`parseType: ${parseType}, processing block, regex match: ${match !== null}, block length: ${blockStr.length}`);
        if (match) {
            const safeTitle = match[1].trim();
            const title = parseType === "v2" ? decodeURIComponent(escape(atob(safeTitle))) : safeTitle;
            const safeText = match[2].trim();
            const text = parseType === "v2" ? decodeURIComponent(escape(atob(safeText))) : safeText;
            addEditableBlock(title, text);
        } else {
            console.log(`無法解析區塊，內容如下:\n${blockStr}\n--- End of block ---`);
        }
    });
}

let bookContent = [];

function getTextFromTabB() {
    const contents = bookContent.join('\n\n--------------------------------\n\n');
    return contents;
}


// Show markdown view
let mdShownState = false;
function showMarkdownView() {
    let mdShow = document.getElementById('mdShowArea');
    let mdShowText = document.getElementById('mdText');

        const content = getTextFromTabB();
        if (content.trim() === "") {
            mdShowText.innerHTML = "沒有內容可顯示";
            return;
        }
        //console.log("解析 Markdown 內容...\n",content,"\n--- End of content ---");
        mdShowText.innerHTML = marked.parse(content);
        mdShow.style.display = "block";
        mdShownState = true;
        updateStatus("Markdown已顯示", 'success');
        document.getElementById('TabB').style.display = "none";
        return;
}   

// --- 初始化 ---
document.addEventListener('DOMContentLoaded', async () => {

    let result = "";
    const paramsFromURL = new URLSearchParams(window.location.search);
    const keys = paramsFromURL.keys();
    const firstKey = keys.next().value;
    const firstValue = paramsFromURL.get(firstKey);
    document.getElementById('topBnt').style.display = "none";
    document.getElementById('markdownViewBtn').style.display = "none";
    document.getElementById('setPW').style.display = "none";

    result = firstKey;
    bookData.aesKey = firstValue || "YfbMlmGq0j5WrCekCbqpn7tocCbNEbid0HCVjQB1xLBSkU3GqjKBtq8a7sQh2Zt"; ;

    let res = null;

    if(!result){
        bookContent = ["HelloWorld!", "Here is your ifnormation."];
        showMarkdownView();
        return;
    }else{
        bookData.Name = result;
        document.title = bookData.Name;  
        try { 
            res = await getFromAPI();
            //console.log("初始載入 API 結果:", res);
            if(res.status !== "success"){
                console.log("初始載入 API 結果:", res);
                throw new Error("getFromAPI 初始載入失敗");
            }
        } catch (error) {
            console.log("getFromAPI 發生錯誤:", error.message);
            updateStatus("找不到文章", 'error');
            return false;   
        }
  
        {
            showMarkdownView();
            document.getElementById('topBnt').style.display = "none";
            document.getElementById('markdownViewBtn').style.display = "none";
        }   
    }
});

    </script>
