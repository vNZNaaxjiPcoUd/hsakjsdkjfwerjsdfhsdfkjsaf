  <title>myip</title>

<body onload="upPage0()">
  <h2><label id="ipI">IP address</label></h2>
  <p><a href="https://h.jwint.net/myip2">detail</a></p>

<script>
    const iurl = "https://api.ipify.org/";

    async function Iip() {     
      let txtIP = "";
      try {
        const response = await fetch(iurl,{cache:"no-cache"});
        if (!response.ok) {
          let labelElement = document.getElementById("ipI");
          labelElement.innerHTML = "0.0.0.0";
          throw new Error(`Response status: ${response.status}`);
        }
        txtIP = await response.text();
        let labelElement = document.getElementById("ipI");
        labelElement.innerHTML = txtIP;

      } catch (error) {
          let labelElement = document.getElementById("ipI");
          labelElement.innerHTML = "9.9.9.9";
		  return "9.9.9.9";
      }
      return txtIP ;
    }   

    async function upPage0(){
        let ipNow = await Iip();
    }
</script>
</body>
</html>
