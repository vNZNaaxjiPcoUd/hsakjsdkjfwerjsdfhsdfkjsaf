<script>
    const iurl = "https://api.ipify.org/";
    const detailUrl = "http://ip-api.com/json/"
    var detailInfo ;  
	var nowIP = "OK";
	
    async function Iip() {     
      let txtIP = "";
      try {
        const response = await fetch(iurl,{cache:"no-cache"});
        if (!response.ok) {
          throw new Error(`Response status: ${response.status}`);
        }
        txtIP = await response.text();
        //console.log(txtIP);
        let labelElement = document.getElementById("ipI");
        labelElement.innerHTML = txtIP;
		
		document.querySelectorAll('a[href*="IPA"]').forEach(a => {
        a.href = a.href.replace("IPAA", txtIP);
   			 });
		nowIP = txtIP ;
      } catch (error) {
        //console.log(error.message);
      }
      return txtIP ;
    }   

	
    async function UpdateDetail(ip){
      //var url=detailUrl.concat(ip);
      var url = detailUrl.concat("?fields=status,message,continent,country,countryCode,region,regionName,city,district,zip,lat,lon,timezone,currency,isp,org,as,asname,reverse,mobile,proxy,hosting,query");
      //console.log(url);
      var detailInfo;
      try {
        const response = await fetch(url,{cache:"no-store"});
        if (!response.ok) {
          throw new Error(`Response status: ${response.status}`);
        }
        detailInfo = await response.json();
      } catch (error) {
        let labelElement = document.getElementById("moreD");
        labelElement.innerHTML = "<- check your GeoIP";
        detailInfo = error.message ;
        return;
      }
      //console.log(detailInfo["lat"]);
      let html = "";
      for (const key in detailInfo){        
          //console.log(`${key} : ${detailInfo[key]}`)
          html = html + `${key} : ${detailInfo[key]}<br>`
      }
      let labelElement = document.getElementById("moreD");
      labelElement.innerHTML = html;
      return;
    }

async function getIpJson(ip) {
      if (!ip || !/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) {
        throw new Error('無效的 IP 地址');
      }

      // 目標 HTTP API
      const targetUrl = `http://ip-api.com/json/${ip}?fields=66846719`;
      
      // 使用免費 CORS 代理：https://api.allorigins.win
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

      const response = await fetch(proxyUrl);
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }

      const data = await response.json();

      // 檢查 API 是否回傳錯誤
      if (data.status === 'fail') {
        throw new Error(data.message || 'IP 查詢失敗');
      }
		pretty = JSON.stringify(data);
		pretty = pretty.replace(/{/g, '<br>');     // 開頭 {
		pretty = pretty.replace(/}/g, '<br>');       // 結尾 }
		pretty = pretty.replace(/,"/g, '<br>"');      // , }
		pretty = pretty.replace(/:/g, '::   ');       // : 後加空格
		pretty = pretty.replace(/"/g, '');       // 清除 "
	  document.getElementById('moreD').innerHTML = pretty;
      return data;
    }

	function forceHttpJump(e) {
	    e.preventDefault();
	    const url = "http://ip-api.com/line/" + nowIP + "?fields=status,message,continent,continentCode,country,countryCode,region,regionName,city,district,zip,lat,lon,timezone,offset,currency,isp,org,as,asname,reverse,mobile,proxy,hosting,query";
	    // 強制跳轉
	    window.location.href = url;
	}
