<script>

	const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
	
    function showTime() {
      const currentDate = new Date();
      const options = { timeZone: timeZone, hour: '2-digit', minute: '2-digit', second: '2-digit'};
      const timestamp = currentDate.toLocaleString('en-US', options);
      let labelElement = document.getElementById("labelWithHTML");
      labelElement.innerHTML = timestamp;
    }

    function startTime() {
      const currentDate = new Date();
      const options = { timeZone: timeZone, hour: '2-digit', minute: '2-digit', second: '2-digit'};
      const timestamp = currentDate.toLocaleString('en-US', options);
      let labelElement = document.getElementById("startT");
      labelElement.innerHTML = timestamp;
    }
	
    const dsurl = "/uuds";

		  	const text = await response.clone().text();
				console.log('Text 內容:', text);
				const data = await response.clone().json();  // 用 clone() 避免 body 被消耗
