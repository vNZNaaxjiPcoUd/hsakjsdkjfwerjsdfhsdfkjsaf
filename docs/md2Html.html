<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 即時預覽編輯器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style id="user-custom-style">
        /* 預設的結果顯示樣式 */
        #preview {
            padding: 20px;
            background-color: white;
            min-height: 100%;
        }
    </style>

    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #333; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .controls { display: flex; gap: 10px; align-items: center; }
        
        main { display: flex; flex: 1; overflow: hidden; }
        .pane { flex: 1; display: flex; flex-direction: column; border: 1px solid #ccc; }
        textarea { flex: 1; padding: 15px; font-family: monospace; font-size: 14px; border: none; resize: none; outline: none; }
        #preview-container { flex: 1; overflow-y: auto; background: #f9f9f9; }
        
        .hidden { display: none !important; }
        button, label { background: #007bff; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-size: 14px; }
        button:hover, label:hover { background: #0056b3; }
        input[type="file"] { display: none; }
        select { padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div class="controls">
        <label for="upload-md">📁 上傳 .md</label>
        <input type="file" id="upload-md" accept=".md">
        
        <select id="view-mode">
            <option value="split">雙邊顯示</option>
            <option value="preview">僅顯示結果</option>
        </select>
    </div>

    <div class="controls">
        <button onclick="downloadHTML()">📥 下載 HTML</button>
        <button onclick="downloadPDF()">📄 下載 PDF</button>
    </div>
</header>

<div style="padding: 10px; background: #eee; border-bottom: 1px solid #ddd;">
    <span style="font-size: 14px; margin-right: 10px;">自訂 CSS (貼上後立即生效):</span>
    <textarea id="css-input" placeholder="例如: h1 { color: red; } body { font-family: serif; }" style="height: 40px; width: 100%; margin-top: 5px;"></textarea>
</div>

<main>
    <section id="editor-pane" class="pane">
        <textarea id="markdown-input" placeholder="在此貼上 Markdown 內容..."></textarea>
    </section>
    
    <section id="preview-pane" class="pane">
        <div id="preview-container">
            <div id="preview"></div>
        </div>
    </section>
</main>

<script>
    const markdownInput = document.getElementById('markdown-input');
    const preview = document.getElementById('preview');
    const cssInput = document.getElementById('css-input');
    const userStyle = document.getElementById('user-custom-style');
    const viewMode = document.getElementById('view-mode');
    const editorPane = document.getElementById('editor-pane');

    // 1. 即時渲染 Markdown
    markdownInput.addEventListener('input', () => {
        preview.innerHTML = marked.parse(markdownInput.value);
    });

    // 2. 切換顯示模式
    viewMode.addEventListener('change', () => {
        if (viewMode.value === 'preview') {
            editorPane.classList.add('hidden');
        } else {
            editorPane.classList.remove('hidden');
        }
    });

    // 3. 上傳 .md 檔案
    document.getElementById('upload-md').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            markdownInput.value = e.target.result;
            preview.innerHTML = marked.parse(markdownInput.value);
        };
        reader.readAsText(file);
    });

    // 4. 自訂 CSS
    cssInput.addEventListener('input', () => {
        userStyle.innerHTML = cssInput.value || ' #preview { padding: 20px; background: white; }';
    });

    // 5. 下載 HTML
    function downloadHTML() {
        const fullHTML = `
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>${userStyle.innerHTML}</style>
</head>
<body>
    <div class="markdown-body">
        ${preview.innerHTML}
    </div>
</body>
</html>`;
        const blob = new Blob([fullHTML], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'export.html';
        a.click();
        URL.revokeObjectURL(url);
    }

    // 6. 下載 PDF
    function downloadPDF() {
        const element = preview;
        const opt = {
            margin:       10,
            filename:     'export.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    // 初始化範例
    markdownInput.value = "# Hello Markdown\n\n這是一個即時編輯器。\n\n* 支援 **粗體**\n* 支援 [連結](https://google.com)\n* 支援上傳與下載！";
    preview.innerHTML = marked.parse(markdownInput.value);
</script>

</body>
</html>
