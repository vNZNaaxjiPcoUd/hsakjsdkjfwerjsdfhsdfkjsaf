<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Bible Story</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body,html{height:100%;background:#000;overflow:hidden}
  #viewer{
    width:100vw;height:100vh;position:relative;
    touch-action:none; /* 讓所有觸控都給我們處理 */
  }
  #photo{
    width:100%;height:100%;
    object-fit:contain;     /* 整張圖可見，支援縮放不裁切 */
    user-select:none;
    touch-action:pinch-zoom; /* 只允許雙指縮放 */
    transition:opacity .1s;
  }
  #counter{
    position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.6);color:#fff;padding:8px 20px;border-radius:30px;
    font-size:16px;z-index:10;pointer-events:none;
  }
</style>
</head>
<body>

<div id="viewer">
  <img id="photo" src="" alt="">
  <div id="counter"></div>
</div>

<script>
// 你的圖片清單
const images = [
 "/pic/np0p1.png",
 "/pic/np0p2.gif",
 "/pic/np1p0.jpg",
 "/pic/np1p1.jpg",
 "/pic/np1p1s1.png",
 "/pic/np1p2.jpg",
 "/pic/np1p3.jpg",
 "/pic/np1p4.jpg",
 "/pic/np1p5.jpg",
 "/pic/np1p6.jpg",
 "/pic/np1p7.jpg",
 "/pic/np1p8.jpg",
 "/pic/np1p9.jpg",
 "/pic/np1p10.jpg",
 "/pic/np1p11.jpg",
 "/pic/np2p1.jpg",
 "/pic/np2p2.jpg",
 "/pic/np2p3.jpg",
 "/pic/np2p4.jpg",
 "/pic/np2p5.jpg",
 "/pic/np2p6.jpg",
 "/pic/np2p7.jpg",
 "/pic/np2p8.jpg",
];
let idx = 0;
const img = document.getElementById('photo');
const counter = document.getElementById('counter');
const viewer = document.getElementById('viewer');

// 載入圖片 + 換圖時重置縮放
function load(n){
  idx = (n + images.length) % images.length;
  img.style.opacity = 0;
  img.style.transform = 'translate(0,0) scale(1)'; // 重置位置與縮放
  img.src = images[idx];
  img.onload = ()=> img.style.opacity = 1;
  counter.textContent = `${idx+1} / ${images.length}`;
}
function next(){ load(idx+1); }
function prev(){ load(idx-1); }

// ────── 雙擊 = 全螢幕（手機電腦都完美） ──────
let lastTap = 0;
viewer.addEventListener('click', e => {
  const now = Date.now();
  if (now - lastTap < 600) {               // 400ms 內點兩下 = 雙擊
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      viewer.requestFullscreen?.() || viewer.webkitRequestFullscreen?.();
    }
  } else {
    // 單點：左右半邊換圖
    const rect = img.getBoundingClientRect();
    e.clientX - rect.left < rect.width/2 ? prev() : next();
  }
  lastTap = now;
});

// ────── 手機左右滑動換圖（避免跟縮放衝突）──────
let sx = 0;
viewer.addEventListener('touchstart', e=> sx = e.touches[0].clientX, {passive:true});
viewer.addEventListener('touchend', e=> {
  if(!sx) return;
  const ex = e.changedTouches[0].clientX;
  const diff = sx - ex;
  if(Math.abs(diff)>60){ diff>0 ? next() : prev(); }
  sx = 0;
}, {passive:true});

// ────── 鍵盤 ──────
document.addEventListener('keydown', e=>{
  if(['ArrowRight','ArrowDown',' '].includes(e.key)) {e.preventDefault(); next();}
  if(['ArrowLeft','ArrowUp'].includes(e.key)) {e.preventDefault(); prev();}
});

// 啟動
load(0);
</script>
</body>
</html>
