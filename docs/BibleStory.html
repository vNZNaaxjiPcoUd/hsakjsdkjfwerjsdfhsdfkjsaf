<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Bible Story</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body, html {
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: pan-y; /* 讓水平滑動不被瀏覽器吃掉 */
  }
  #viewer {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #photo {
    /* 關鍵：讓圖片永遠填滿整個螢幕 */
    width: 100vw;
    height: 100vh;
    /* object-fit: cover;     /* 填滿螢幕，會裁切邊緣 */
    /* 如果你想要「完整顯示整張圖，不裁切」，改成 contain + 背景黑 */
    object-fit: contain; 
    background: #000;
    transition: opacity 0.4s ease;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.4);
    color: white;
    border: none;
    width: 70px;
    height: 100px;
    font-size: 50px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 10;
    border-radius: 8px;
  }
  #viewer:hover .nav-btn,
  .nav-btn:active { opacity: 0.7; }
  #prev { left: 10px; }
  #next { right: 10px; }

  #counter {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    color: white;
    padding: 8px 20px;
    border-radius: 30px;
    font-size: 16px;
    z-index: 5;
  }
</style>
</head>
<body>

<div id="viewer">
  <button id="prev" class="nav-btn" aria-label="上一張">‹</button>
 <img id="photo" src="" alt="圖片">
 <button id="next" class="nav-btn" aria-label="下一張">›</button>
 <div id="counter"></div>
</div>

<script>
// ==== 請在這裡放入你的圖片網址（支援本地或遠端）====
const images = [
 "/pic/np0p1.png",
 "/pic/np0p2.gif",
 "/pic/np1p0.jpg",
 "/pic/np1p1.jpg",
 "/pic/np1p1s1.png",
 "/pic/np1p2.jpg",
 "/pic/np1p3.jpg",
 "/pic/np1p4.jpg",
 "/pic/np1p5.jpg",
 "/pic/np1p6.jpg",
 "/pic/np1p7.jpg",
 "/pic/np1p8.jpg",
 "/pic/np1p9.jpg",
 "/pic/np1p10.jpg",
 "/pic/np1p11.jpg",
 "/pic/np2p1.jpg",
 "/pic/np2p2.jpg",
 "/pic/np2p3.jpg",
 "/pic/np2p4.jpg",
 "/pic/np2p5.jpg",
 "/pic/np2p6.jpg",
 "/pic/np2p7.jpg",
 "/pic/np2p8.jpg",
];
// =====================================================
let current = 0;
const img = document.getElementById('photo');
const counter = document.getElementById('counter');

function show(n) {
  current = (n + images.length) % images.length;
  img.style.opacity = 0;
  img.src = images[current];
  img.onload = () => img.style.opacity = 1;
  counter.textContent = `${current + 1} / ${images.length}`;
}
function next() { show(current + 1); }
function prev() { show(current - 1); }

// 鍵盤（包含手機實體鍵盤）
document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown',' '].includes(e.key)) { e.preventDefault(); next(); }
  if (['ArrowLeft','ArrowUp'].includes(e.key)) { e.preventDefault(); prev(); }
});

// 滑鼠點擊左右半邊（電腦＆手機點擊都支援）
img.addEventListener('click', e => {
  const rect = img.getBoundingClientRect();
  const x = e.clientX - rect.left;
  x < rect.width/2 ? prev() : next();
});

// 左右按鈕
document.getElementById('prev').onclick = prev;
document.getElementById('next').onclick = next;

// 手機滑動（最重要）
let startX = 0;
document.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
}, {passive:true});

document.addEventListener('touchend', e => {
  if (!startX) return;
  const endX = e.changedTouches[0].clientX;
  const diff = startX - endX;
  if (Math.abs(diff) > 50) { // 滑動距離 > 50px 才觸發
    diff > 0 ? next() : prev();
  }
  startX = 0;
}, {passive:true});

// 啟動第一張
show(0);
</script>
</body>
</html>
