<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Bible Story</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body,html{height:100%;background:#000;overflow:hidden}
  #viewer{
    width:100vw;height:100vh;position:relative;
    touch-action:none;
  }
  #photo{
    width:100vw;height:100vh; /* 固定 vw/vh 避免 Safari 計算錯誤 */
    object-fit:contain; /* 填滿螢幕，支援縮放 */
    object-position:center;
    user-select:none;
    touch-action:pinch-zoom pan-x pan-y; /* 允許雙指縮放 + 拖曳 */
    transition:opacity .1s;
  }
  #counter{
    position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.6);color:#fff;padding:8px 20px;border-radius:30px;
    font-size:16px;z-index:10;pointer-events:none;
  }
</style>
</head>
<body>

<div id="viewer">
  <img id="photo" src="" alt="">
  <div id="counter"></div>

</div>
 <br><br><br><br><br><br><br><br><br>
<script>
// 你的圖片清單
const images = [
 "/pic/np0p1.png",
 "/pic/np0p2.gif",
 "/pic/np1p0.jpg",
 "/pic/np1p1.jpg",
 "/pic/np1p1s1.png",
 "/pic/np1p2.jpg",
 "/pic/np1p3.jpg",
 "/pic/np1p4.jpg",
 "/pic/np1p5.jpg",
 "/pic/np1p6.jpg",
 "/pic/np1p7.jpg",
 "/pic/np1p8.jpg",
 "/pic/np1p9.jpg",
 "/pic/np1p10.jpg",
 "/pic/np1p11.jpg",
 "/pic/np2p1.jpg",
 "/pic/np2p2.jpg",
 "/pic/np2p3.jpg",
 "/pic/np2p4.jpg",
 "/pic/np2p5.jpg",
 "/pic/np2p6.jpg",
 "/pic/np2p7.jpg",
 "/pic/np2p8.jpg",
];
let idx = 0;
const img = document.getElementById('photo');
const counter = document.getElementById('counter');
const viewer = document.getElementById('viewer');

// 載入圖片 + 換圖時重置縮放
function load(n){
  idx = (n + images.length) % images.length;
  img.style.opacity = 0;
  img.style.transform = 'translate(0,0) scale(1)'; // 重置
  img.src = images[idx];
  img.onload = ()=> img.style.opacity = 1;
  counter.textContent = `${idx+1} / ${images.length}`;
}
function next(){ load(idx+1); }
function prev(){ load(idx-1); }

// ────── 雙擊：快速左右換圖（iPhone 上無 Fullscreen，所以改成雙擊左右） ──────
let lastTap = 0, tapX = 0;
viewer.addEventListener('click', e => {
  tapX = e.clientX || e.touches[0].clientX;
  const now = Date.now();
  if (now - lastTap < 400) {  // 雙擊偵測
    const rect = viewer.getBoundingClientRect();
    (tapX - rect.left) < rect.width/2 ? prev() : next();
  }
  lastTap = now;
});

// ────── 單擊：左右半邊換圖 ──────
img.addEventListener('click', e => {
  const rect = img.getBoundingClientRect();
  (e.clientX - rect.left) < rect.width/2 ? prev() : next();
});

// ────── 手機滑動換圖 ──────
let sx = 0, sy = 0;
viewer.addEventListener('touchstart', e=> {
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
}, {passive:true});
viewer.addEventListener('touchend', e=> {
  if(!sx) return;
  const ex = e.changedTouches[0].clientX;
  const ey = e.changedTouches[0].clientY;
  const diffX = sx - ex;
  const diffY = Math.abs(sy - ey);
  if(Math.abs(diffX) > 50 && diffY < 100) {  // 水平滑動優先
    diffX > 0 ? next() : prev();
  }
  sx = sy = 0;
}, {passive:true});

// ────── 鍵盤 ──────
document.addEventListener('keydown', e=>{
  if(['ArrowRight','ArrowDown',' '].includes(e.key)) {e.preventDefault(); next();}
  if(['ArrowLeft','ArrowUp'].includes(e.key)) {e.preventDefault(); prev();}
});

// 啟動
load(0);
</script>
</body>
</html>
