<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生活百科 AI 助手</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary-color: #10a37f;
            --bg-color: #f7f7f8;
            --user-bubble: #ffffff;
            --ai-bubble: #f7f7f8;
            --border-color: #d9d9e3;
            --text-main: #374151;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background-color: white; color: var(--text-main);
            display: flex; flex-direction: column; height: 80vh; overflow: hidden;
        }

        /* 導航列 */
        .navbar {
            padding: 12px 20px; background: white; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .navbar h1 { margin: 0; font-size: 1.1rem; }
        .status-badge { font-size: 12px; padding: 4px 12px; border-radius: 20px; background: #ef4444; color: white; }
        .status-badge.unlocked { background: var(--primary-color); }

        /* 對話容器 */
        #chat-container { flex: 1; overflow-y: auto; width: 100%; scroll-behavior: smooth; }
        .chat-content { max-width: 850px; margin: 0 auto; width: 100%; }

        .message-row { padding: 24px 20px; display: flex; justify-content: center; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .message-row.user-type { background-color: white; }
        .message-row.ai-type { background-color: var(--ai-bubble); }

        .message-wrapper { max-width: 850px; width: 100%; display: flex; gap: 20px; position: relative; }
        .avatar { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold; font-size: 12px; color: white; }
        .user-avatar { background: #5436da; }
        .ai-avatar { background: var(--primary-color); }

        .bubble { flex: 1; font-size: 16px; line-height: 1.6; word-wrap: break-word; position: relative; }
        
        /* 複製按鈕樣式 */
        .copy-btn {
            display: flex; align-items: center; gap: 4px;
            background: transparent; border: 1px solid #d1d1d6; color: #8e8e93;
            padding: 4px 8px; border-radius: 6px; cursor: pointer;
            font-size: 12px; margin-top: 10px; transition: 0.2s;
        }
        .copy-btn:hover { background: #e5e5ea; color: #1c1c1e; }
        .copy-btn svg { width: 14px; height: 14px; }

        /* 輸入區域 */
        .input-area { padding: 20px; background: linear-gradient(transparent, white 20%); }
        .input-wrapper { max-width: 850px; margin: 0 auto; position: relative; display: flex; align-items: center; box-shadow: 0 0 15px rgba(0,0,0,0.1); border-radius: 12px; background: white; border: 1px solid var(--border-color); }
        #userInput { width: 100%; border: none; padding: 14px 50px 14px 16px; border-radius: 12px; font-size: 16px; outline: none; }
        #sendBtn { position: absolute; right: 8px; background: transparent; border: none; cursor: pointer; color: #acacbe; padding: 4px; display: flex; }

        /* 載入中動畫 */
        .loading-dots { display: inline-flex; gap: 4px; }
        .dot { width: 4px; height: 4px; background: #666; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        @media (max-width: 600px) {
            .message-row { padding: 16px 12px; }
            .message-wrapper { gap: 12px; }
            .bubble { font-size: 15px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>🏠 生活百科 AI</h1>
        <div id="status" class="status-badge">未解鎖</div>
    </nav>

    <div id="chat-container">
        <div class="chat-content" id="chat-list">
            <div class="message-row ai-type">
                <div class="message-wrapper">
                    <div class="avatar ai-avatar">AI</div>
                    <div class="bubble">
                        您好！我是您的生活百科專家。🧪<br><br>
                        請輸入 <code>key=您的解密密碼</code> 以開始。
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="輸入訊息或 key=密碼..." autocomplete="off">
            <button id="sendBtn">
                <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="20" width="20"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIG: 請替換為你加密後的字串
        const ENCRYPTED_DATA = "U2FsdGVkX1/cMjoWs1ribSHx3tUhUwlvgd5vYvPO7rulKa12/ghN7G0G96B0xJzvPtEFuUI+mRSbF65UlGEaPg"; 
        // ==========================================
        // ref: https://c73/Note/gemini%20API.md
        
        let apiKey = "";
        let chatHistory = [];
        const chatList = document.getElementById('chat-list');
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusBadge = document.getElementById('status');

        const SYSTEM_PROMPT = "你是一位親切的生活百科專家。任務是解答日常生活問題。請用繁體中文，重點處使用粗體或條列式或表格式。用最簡單精要的方式回答，不需要問候。若回答內容較長，請確保完整輸出不要中斷。";

        // 複製功能函數
        async function copyToClipboard(text, btnElement) {
            try {
                await navigator.clipboard.writeText(text);
                const originalHTML = btnElement.innerHTML;
                btnElement.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> 已複製`;
                btnElement.style.color = "#10a37f";
                setTimeout(() => {
                    btnElement.innerHTML = originalHTML;
                    btnElement.style.color = "";
                }, 2000);
            } catch (err) {
                console.error('無法複製', err);
            }
        }

        function appendMessage(role, content) {
            const isAI = role === 'ai';
            const row = document.createElement('div');
            row.className = `message-row ${isAI ? 'ai-type' : 'user-type'}`;
            
            // 建立容器
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            
            // 建立內容
            const avatar = `<div class="avatar ${isAI ? 'ai-avatar' : 'user-avatar'}">${isAI ? 'AI' : '我'}</div>`;
            const bubbleContent = isAI ? marked.parse(content) : content;
            
            let html = `${avatar}<div class="bubble">${bubbleContent}`;
            
            // 如果是 AI，加入複製按鈕
            if (isAI && content.length > 5 && !content.includes("思考中")) {
                const btnId = 'copy-' + Date.now();
                html += `<button class="copy-btn" id="${btnId}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    複製原文
                </button>`;
                wrapper.innerHTML = html + `</div>`;
                row.appendChild(wrapper);
                chatList.appendChild(row);
                
                // 綁定點擊事件
                setTimeout(() => {
                    const btn = document.getElementById(btnId);
                    if(btn) btn.onclick = () => copyToClipboard(content, btn);
                }, 0);
            } else {
                wrapper.innerHTML = html + `</div>`;
                row.appendChild(wrapper);
                chatList.appendChild(row);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
            return row;
        }

        async function handleSend() {
            const val = userInput.value.trim();
            if (!val) return;

            if (val.startsWith("key=")) {
                const pass = val.replace("key=", "");
                try {
                    const bytes = CryptoJS.AES.decrypt(ENCRYPTED_DATA, pass);
                    const decoded = bytes.toString(CryptoJS.enc.Utf8);
                    if (decoded.length > 10) {
                        apiKey = decoded;
                        statusBadge.innerText = "已解鎖";
                        statusBadge.className = "status-badge unlocked";
                        appendMessage('ai', "🔓 **解鎖成功！** 請問有什麼生活知識可以幫您的？");
                    } else { throw new Error(); }
                } catch (e) { appendMessage('ai', "❌ 密碼錯誤。"); }
                userInput.value = ""; return;
            }

            if (!apiKey) { appendMessage('ai', "⚠️ 請輸入 `key=密碼`。"); return; }

            appendMessage('user', val);
            userInput.value = "";
            sendBtn.disabled = true;
            
            const loadingRow = appendMessage('ai', `<div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div> 思考中...`);

            try {
                // 指向 Gemini 2.5 Flash
                //const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
                        contents: [...chatHistory, { role: "user", parts: [{ text: val }] }],
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 8192, // 提高 Token 上限防止中斷
                        },
                        safetySettings: [ // 放寬安全設定防止誤判截斷
                            { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                        ]
                    })
                });

                const data = await response.json();
                if (response.status === 429) {
                    // 429 是 Too Many Requests (額度超限)
                    loadingRow.querySelector('.bubble').innerHTML = " 滿了 "；
                }
                if (data.error) throw new Error(data.error.message);

                const aiMsg = data.candidates[0].content.parts[0].text;
                
                // 移除 loading 訊息並替換成正式訊息
                loadingRow.remove();
                appendMessage('ai', aiMsg);

                chatHistory.push({ role: "user", parts: [{ text: val }] });
                chatHistory.push({ role: "model", parts: [{ text: aiMsg }] });
                if (chatHistory.length > 12) chatHistory.splice(0, 2);

            } catch (err) {
                loadingRow.querySelector('.bubble').innerHTML = "❌ **錯誤：** "; //+ err.message;
                console.log("AI error "+err.message);
            } finally {
                sendBtn.disabled = false;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        sendBtn.onclick = handleSend;
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
        });
    </script>
</body>
</html>
