layout: empty
---
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生活百科 AI 助手</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary-color: #10a37f;
            --bg-color: #f7f7f8;
            --user-bubble: #ffffff;
            --ai-bubble: #f7f7f8;
            --border-color: #d9d9e3;
            --text-main: #374151;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background-color: white; color: var(--text-main);
            display: flex; flex-direction: column; 
            height: 96vh; height: 100dvh; overflow: hidden;
        }

        /* 導航列：極致壓縮 */
        .navbar {
            padding: 4px 10px;
            background: white; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .navbar h1 { margin: 0; font-size: 0.9rem; font-weight: 600; }
        .status-badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: #ef4444; color: white; }
        .status-badge.unlocked { background: var(--primary-color); }

        /* 對話容器：最大化寬度 */
        #chat-container { flex: 1; overflow-y: auto; width: 100%; scroll-behavior: smooth; }
        .chat-content { max-width: 1200px; margin: 0 auto; width: 100%; }

        /* 訊息列：極窄上下間距 */
        .message-row { 
            padding: 6px 10px; 
            display: flex; justify-content: center; border-bottom: 1px solid rgba(0,0,0,0.03); 
        }
        .message-row.user-type { background-color: white; }
        .message-row.ai-type { background-color: var(--ai-bubble); }

        .message-wrapper { 
            max-width: 100%; width: 100%; display: flex; 
            gap: 8px; position: relative; 
        }

        /* 頭像縮小，不佔空間 */
        .avatar { 
            width: 22px; height: 22px; 
            border-radius: 3px; display: flex; align-items: center; justify-content: center; 
            flex-shrink: 0; font-weight: bold; font-size: 9px; color: white; margin-top: 3px;
        }
        .user-avatar { background: #5436da; }
        .ai-avatar { background: var(--primary-color); }

        /* 內容區：字體適中，行高緊湊 */
        .bubble { flex: 1; font-size: 15px; line-height: 1.5; word-wrap: break-word; position: relative; }
        .bubble p { margin: 2px 0; } 
        
        /* 「複製原文」按鈕：保持小巧精簡 */
        .copy-btn {
            display: inline-flex; align-items: center; gap: 4px;
            background: transparent; border: 1px solid #d1d1d6; color: #8e8e93;
            padding: 2px 6px; border-radius: 4px; cursor: pointer;
            font-size: 11px; margin-top: 5px; transition: 0.2s;
            line-height: 1;
        }
        .copy-btn:hover { background: #e5e5ea; color: #1c1c1e; }
        .copy-btn svg { width: 12px; height: 12px; }

        /* 輸入區域：節省底部空間 */
        .input-area { 
            padding: 6px 10px; 
            background: white; border-top: 1px solid var(--border-color);
        }
        .input-wrapper { 
            max-width: 1200px; margin: 0 auto; position: relative; 
            display: flex; align-items: center; border-radius: 6px; 
            background: white; border: 1px solid var(--border-color); 
        }
        #userInput { 
            width: 100%; border: none; padding: 8px 40px 8px 12px; 
            border-radius: 6px; font-size: 15px; outline: none; 
        }
        #sendBtn { position: absolute; right: 4px; background: transparent; border: none; cursor: pointer; color: #acacbe; padding: 4px; }
        #sendBtn svg { width: 18px; height: 18px; }

        /* 載入中動畫 */
        .loading-dots { display: inline-flex; gap: 3px; }
        .dot { width: 3px; height: 3px; background: #666; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }

        /* 手機端優化：極致利用螢幕寬度 */
        @media (max-width: 600px) {
            .navbar { padding: 4px 6px; }
            .message-row { padding: 4px 6px; }
            .message-wrapper { gap: 6px; }
            .bubble { font-size: 14.5px; }
            .input-area { padding: 4px 6px; }
            .avatar { width: 18px; height: 18px; font-size: 8px; }
            .copy-btn { padding: 2px 5px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>🏠 生活百科</h1>
        <div id="status" class="status-badge">未解鎖</div>
    </nav>

    <div id="chat-container">
        <div class="chat-content" id="chat-list">
            <div class="message-row ai-type">
                <div class="message-wrapper">
                    <div class="avatar ai-avatar">寶</div>
                    <div class="bubble">
                        您好！我是您的生活百科專家。🧪<br><br>
                        請輸入 <code>通關密語</code> 來開始。
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <!-- 新增的「複製所有AI回答」按鈕 -->
        <div id="buttonbutton">
            <div style="display: flex; justify-content: center; gap: 10px;" >
                <button id="copyAllBtn" class="copy-btn" style="display: block; margin: 0 auto 8px auto; border-color: var(--primary-color); color: var(--primary-color); background: white;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    複製所有回答
                </button>
                <button id="ptGo" class="copy-btn" style="display: block; margin: 0 auto 8px auto; border-color: var(--primary-color); color: var(--primary-color); background: white;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    ptGo
                </button>
            </div>
        </div>
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="聊什麼..." autocomplete="off">
            <button id="sendBtn">
                <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="20" width="20"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIG: 請替換為你加密後的字串
        const ENCRYPTED_DATA = "U2FsdGVkX1/FePeQBorQGx4etwvZdZ/XFRL+S/Ag88UL6aGDKeFXm/qbNM0M+QK0WEKshoKe82UMjUCboUY3+g"; 
        const encNote = "U2FsdGVkX1/cZ8GiGq9vW9iSrwjjOCW6c3R3zgReP36YEXchPOVqr1gV6BZViO7YX8kUI0MygeWYKJDPLVR2Og";
        // ==========================================
        
        let apiKey = "";
        let chatHistory = [];
        const chatList = document.getElementById('chat-list');
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusBadge = document.getElementById('status');
        let decNote = "";

        //const SYSTEM_PROMPT = "你是一位親切的生活百科專家。任務是解答日常生活問題。請用繁體中文，重點處使用粗體或條列式或表格式。用最簡單精要的方式回答，不需要問候。若回答內容較長，請確保完整輸出不要中斷。";
        const SYSTEM_PROMPT = "你是一位溫婉可人、知識淵博的生活百科專家。你的回答總是簡潔、溫暖且充滿智慧。你不會主動提問，只會專注於提供清晰、實用的解答。你的目標是幫助使用者解決日常生活中的各種疑問，讓他們感到安心與受用。";

        async function copyToClipboard(text, btnElement) {
            try {
                await navigator.clipboard.writeText(text);
                const originalHTML = btnElement.innerHTML;
                btnElement.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> 已複製`;
                btnElement.style.color = "#10a37f";
                setTimeout(() => {
                    btnElement.innerHTML = originalHTML;
                    btnElement.style.color = "";
                }, 2000);
            } catch (err) {
                console.error('無法複製', err);
            }
        }

        // 新增的複製所有 AI 回覆 Markdown 的功能函數
        async function copyAllAIMarkdown() {
            // 篩選出所有 'model' 角色（即 AI 回覆）的內容
            const aiResponses = chatHistory
                .filter(msg => msg.role === 'model')
                .map(msg => msg.parts[0].text);

            if (aiResponses.length === 0) {
                alert("目前沒有 AI 回答可以複製。");
                return;
            }

            // 將所有 AI 回覆的 Markdown 內容用分隔線組合起來
            const allMarkdown = aiResponses.join('\n\n---\n\n'); 

            const copyBtn = document.getElementById('copyAllBtn');
            try {
                await navigator.clipboard.writeText(allMarkdown);
                
                const originalHTML = copyBtn.innerHTML;
                copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> 全部已複製`;
                copyBtn.style.borderColor = "#10a37f";
                copyBtn.style.color = "#10a37f";

                setTimeout(() => {
                    copyBtn.innerHTML = originalHTML;
                    copyBtn.style.borderColor = "var(--primary-color)";
                    copyBtn.style.color = "var(--primary-color)";
                }, 3000);
            } catch (err) {
                console.error('無法複製所有內容', err);
                alert('複製失敗，請檢查瀏覽器權限或手動複製。');
            }
        }

        function appendMessage(role, content) {
            const isAI = role === 'ai';
            const row = document.createElement('div');
            row.className = `message-row ${isAI ? 'ai-type' : 'user-type'}`;
            
            // 建立容器
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            
            // 建立內容
            const avatar = `<div class="avatar ${isAI ? 'ai-avatar' : 'user-avatar'}">${isAI ? '寶' : '我'}</div>`;
            const bubbleContent = isAI ? marked.parse(content) : content;
            
            let html = `${avatar}<div class="bubble">${bubbleContent}`;
            
            // 如果是 AI，加入複製按鈕
            if (isAI && content.length > 5 && !content.includes("思考中")) {
                const btnId = 'copy-' + Date.now();
                html += `<button class="copy-btn" id="${btnId}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    複製原文
                </button>`;
                wrapper.innerHTML = html + `</div>`;
                row.appendChild(wrapper);
                chatList.appendChild(row);
                
                // 綁定點擊事件
                setTimeout(() => {
                    const btn = document.getElementById(btnId);
                    if(btn) btn.onclick = () => copyToClipboard(content, btn);
                }, 0);
            } else {
                wrapper.innerHTML = html + `</div>`;
                row.appendChild(wrapper);
                chatList.appendChild(row);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
            return row;
        }

        function handleMyAnswer(val){
            if (/^restart/i.test(val)) {
                location.reload();userInput.value = ""; return true;
            }
            if (/^reboot/i.test(val)) {
                location.reload();userInput.value = ""; return true;
            }
            if (/^note/i.test(val)) {
                openPT();userInput.value = ""; return true;
            }
            if (/^hi/i.test(val)) {
                appendMessage('ai', " Hi Hi 你好呀！ "); userInput.value = ""; return true;
            }            
            if (/^hihi/i.test(val)) {
                appendMessage('ai', " Hi Hi 你好呀！ "); userInput.value = ""; return true;
            }            
            if (/^早/i.test(val)) {
                appendMessage('ai', " Hi Hi 你好呀！ "); userInput.value = ""; return true;
            }            
            if (/^show history/i.test(val)) {
                userInput.value = ""; 
                console.log(chatHistory);
                return true;
            }            
          
            return false;
        }
        async function handleSend() {
            const val = userInput.value.trim();
            if (!val) return;

            if(handleMyAnswer(val)=== true){ return; }

            if (!apiKey) {
                if (/^key /i.test(val)) {
                    // 使用 replace 配合正規表達式將開頭的 key= (不論大小寫) 移除
                    const AA = val.replace(/^key /i, "");
                    try {
                        const pass = CryptoJS.SHA512(AA).toString();
                        const bytes = CryptoJS.AES.decrypt(ENCRYPTED_DATA, pass);
                        const decoded = bytes.toString(CryptoJS.enc.Utf8);
                        if (decoded.length > 10) {
                            apiKey = decoded;
                            statusBadge.innerText = "四十大盜寶庫門開";
                            statusBadge.className = "status-badge unlocked";
                            appendMessage('ai', "🔓 **開門成功！**");
                            document.getElementById('buttonbutton').style.display = "block";
                            decNote = CryptoJS.AES.decrypt(encNote, pass).toString(CryptoJS.enc.Utf8);
                        } else { throw new Error(); }
                    } catch (e) { appendMessage('ai', "❌ 芝麻不開門。"); }
                    userInput.value = ""; 
                    return;
                }

                if (!apiKey) { appendMessage('ai', "⚠️ 不行喔！。"); userInput.value = ""; return; }
            }else{

            }
            appendMessage('user', val);
            userInput.value = "";
            sendBtn.disabled = true;
            
            const loadingRow = appendMessage('ai', `<div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div> 思考中...`);

            try {
                const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${apiKey}`;
                
                const tools = [ { googleSearch: {} } ];
                const safetySettings = [
                    {
                        category: "HARM_CATEGORY_HARASSMENT",
                        threshold: "BLOCK_MEDIUM_AND_ABOVE" // 保持中等或以上風險才阻擋
                    },
                    {
                        category: "HARM_CATEGORY_HATE_SPEECH",
                        threshold: "BLOCK_MEDIUM_AND_ABOVE" // 保持中等或以上風險才阻擋
                    },
                    {
                        category: "HARM_CATEGORY_SEXUALLY_EXPLICIT",
                        threshold: "BLOCK_MEDIUM_AND_ABOVE" // 保持中等或以上風險才阻擋
                    },
                    {
                        category: "HARM_CATEGORY_DANGEROUS_CONTENT",
                        threshold: "BLOCK_MEDIUM_AND_ABOVE" // 保持中等或以上風險才阻擋
                    }
                ];

                const response = await fetch(API_URL, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
                                        tools,
                                        contents: [...chatHistory, { role: "user", parts: [{ text: val }] }],
                                        generationConfig: {
                                            temperature: 0.5,
                                            maxOutputTokens: 8192,
                                            "thinkingConfig": {
                                                "thinkingBudget": 0
                                            }
                                        },
                                        safetySettings,
                                    })
                                });
                const data = await response.json();
                console.log(response.status);
                if (response.status === 429) {
                    // 429 是 Too Many Requests (額度超限)
                    loadingRow.remove();
                    appendMessage('ai', " 滿了 ");;
                }
                if (data.error) throw new Error(data.error.message);

                const aiMsg = data.candidates[0].content.parts[0].text;
                
                // 移除 loading 訊息並替換成正式訊息
                loadingRow.remove();
                appendMessage('ai', aiMsg);

                chatHistory.push({ role: "user", parts: [{ text: val }] });
                chatHistory.push({ role: "model", parts: [{ text: aiMsg }] });
                if (chatHistory.length > 12) chatHistory.splice(0, 2);

            } catch (err) {
                loadingRow.querySelector('.bubble').innerHTML = "❌ **錯誤：** "; //+ err.message;
                console.log("AI error "+err.message);
            } finally {
                sendBtn.disabled = false;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        sendBtn.onclick = handleSend;
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
        });
        
        function openPT(){
            window.open(decNote, '_blank');
        }
        // 綁定新按鈕事件
        document.getElementById('copyAllBtn').onclick = copyAllAIMarkdown;
        document.getElementById('ptGo').onclick = openPT;
        document.getElementById('buttonbutton').style.display = "none";
    </script>
</body>
</html>
