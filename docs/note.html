<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- 加入 noindex 防止搜尋引擎索引這個 404 頁面本身 -->
    <meta name="robots" content="noindex">
    <meta http-equiv="cache-control" content="no-cache" />
    <title>Redirecting...</title>
    <style>
        /* 隱藏內容避免閃爍 */
        body { display: none; } 
    </style>
</head>
<body>
    <script>
        function jumpToBook() {
            // 解構並保留 hash (例如 #page2)
            let { origin, pathname, search, hash } = window.location;

            // 處理 URL 編碼 (例如把 %20 轉回 空白，%E5 轉回中文)
            pathname = decodeURIComponent(pathname);
            search = decodeURIComponent(search);


            // 1. 去除開頭斜線
            const pathPart = pathname.substring(1); 
            // 2. 去除開頭問號
            const queryPart = search.startsWith('?') ? search.substring(1) : search;
            
            //console.log("p&q", pathPart, queryPart, hash);
            if (pathPart.length > 0) {
                let newSearch = "";

                if (queryPart.length > 0) {
                    // Case: /abc?efg -> ?abc=efg
                    newSearch = `?${pathPart}=${queryPart}`;
                } else {
                    // Case: /abc -> ?abc
                    // Case: /abc=efg -> ?abc=efg
                    newSearch = `?${pathPart}`;
                }

                if (queryPart.length > 0) {
                    // Case: /abc?efg -> ?efg
                    newSearch = `?${queryPart}`;
                    //console.log("n", newSearch);
                } else {
                    // Case: /abc -> ?abc
                    // Case: /abc=efg -> ''
                    newSearch = ``;
                    //console.log("n2", newSearch);
                }
                
                // 組合新網址 (記得把 hash 加回去)
                //const targetURL = `${origin}/?${newSearch.substring(1)}${hash}`;

                //const targetURL = `https://h.jwint.net/note/?${newSearch.substring(1)}${hash}`;
                const targetURL = `https://h.jwint.net/note/${newSearch}${hash}`;
                console.log(targetURL);
                // 執行跳轉
                window.location.replace(targetURL);
            }else {
                // 如果沒有路徑，手動導回首頁
                console.log("o",origin);
                //window.location.replace(origin);
                window.location.replace('https://h.jwint.net/note/');
            }
        }
            
        jumpToBook();
    </script>
</body>
</html>
