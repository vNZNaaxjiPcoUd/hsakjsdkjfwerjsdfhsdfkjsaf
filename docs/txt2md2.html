<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>純文字轉 Markdown 工具</title>
    <!-- 引入 Tailwind CSS 進行快速排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        textarea { resize: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col">

    <!-- 標題區 -->
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">📄 純文字轉 Markdown 格式化工具</h1>
            <span class="text-sm opacity-80">貼上文章 -> 自動格式化</span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow container mx-auto p-4 flex flex-col md:flex-row gap-4 h-full">
        
        <!-- 左側：輸入區 -->
        <div class="flex-1 flex flex-col bg-white rounded-lg shadow-md overflow-hidden">
            <div class="bg-gray-200 p-3 border-b border-gray-300 flex justify-between items-center">
                <label class="font-bold text-gray-700">1. 輸入原始文章 (貼上純文字)</label>
                <button onclick="clearInput()" class="text-xs text-red-600 hover:text-red-800">清空</button>
            </div>
            <textarea id="inputText" class="flex-grow p-4 focus:outline-none w-full h-full font-mono text-sm" 
                placeholder="請在此貼上您的長篇文章...&#10;例如：&#10;這是第一段。&#10;這是第二段，中間有一個換行。"></textarea>
        </div>

        <!-- 中間：設定與轉換按鈕 (手機版時會變橫向) -->
        <div class="flex flex-col gap-4 justify-center md:w-48 shrink-0">
            
            <div class="bg-white p-4 rounded-lg shadow-md">
                <h3 class="font-bold text-gray-700 mb-2 text-sm">換行處理模式</h3>
                <select id="newlineMode" class="w-full p-2 border rounded text-sm mb-2">
                    <option value="paragraph">單次換行 = 新段落 (\n\n)</option>
                    <option value="break">單次換行 = 強制換行 (  \n)</option>
                    <option value="merge">合併斷行 (PDF修復用)</option>
                    <option value="keep">保持原樣 (不處理)</option>
                </select>
                <p class="text-xs text-gray-500 mb-4" id="modeDesc">Markdown 標準中，兩個換行才是新段落。此選項將把您輸入的單個換行轉換為兩個換行。</p>

                <div class="flex items-center gap-2 mb-2">
                    <input type="checkbox" id="convertBullets" checked class="rounded text-blue-600">
                    <label for="convertBullets" class="text-sm select-none">自動修復列表 (• -> -)</label>
                </div>
            </div>

            <button onclick="convertText()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded shadow transition transform active:scale-95 flex items-center justify-center gap-2">
                <span>轉換為 Markdown</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
            </button>
        </div>

        <!-- 右側：輸出區 -->
        <div class="flex-1 flex flex-col bg-white rounded-lg shadow-md overflow-hidden border-2 border-dashed border-gray-300" id="outputContainer">
            <div class="bg-gray-50 p-3 border-b border-gray-200 flex justify-between items-center">
                <label class="font-bold text-gray-700">2. Markdown 結果</label>
                <button onclick="copyToClipboard()" id="copyBtn" class="bg-green-500 hover:bg-green-600 text-white text-xs px-3 py-1 rounded transition">
                    複製結果
                </button>
            </div>
            <textarea id="outputText" readonly class="flex-grow p-4 focus:outline-none w-full h-full font-mono text-sm bg-gray-50 text-gray-700"></textarea>
        </div>

    </main>

    <script>
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const newlineMode = document.getElementById('newlineMode');
        const modeDesc = document.getElementById('modeDesc');
        const convertBullets = document.getElementById('convertBullets');

        // 更新模式說明文字
        newlineMode.addEventListener('change', function() {
            const descs = {
                'paragraph': '將輸入中的「單個 Enter」轉換為 Markdown 的「兩個 Enter」，確保在預覽時會分段。',
                'break': '在每行結尾加入兩個空白，Markdown 會將其渲染為 `<br>` (強制換行但不斷落)。',
                'merge': '將單個換行刪除並補上空白。適用於修復從 PDF 複製下來的斷裂文字。',
                'keep': '不做任何額外的換行處理，僅轉換特殊符號。'
            };
            modeDesc.textContent = descs[this.value];
        });

        function convertText() {
            let text = inputText.value;
            
            // 0. 基本清理：統一換行符號
            text = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

            // 1. 處理列表符號 (如果勾選)
            if (convertBullets.checked) {
                // 將 •, ■, ⁃ 等常見符號轉為 Markdown 的 - 
                text = text.replace(/^[ \t]*[•■⁃][ \t]*/gm, "- ");
                // 處理數字列表 (例如 "1. " 保持不變，但確保格式)
            }

            // 2. 根據模式處理換行
            const mode = newlineMode.value;

            if (mode === 'paragraph') {
                // 邏輯：
                // 如果已經有連續兩個換行 (\n\n)，保留它。
                // 如果只有單個換行 (\n)，把它變成 (\n\n)。
                
                // 先把所有多重換行縮減為特殊標記，避免重複處理
                // 但簡單的做法是：先分割段落，再過濾
                
                // 簡易且有效的策略：
                // 1. 把所有連續空白行 (\n\s*\n) 視為真正的段落分隔
                // 2. 其餘單獨的 \n 視為使用者想分段但只按了一次
                
                // 實作：將所有換行都變成雙換行，然後把 3 個以上的換行縮減回 2 個
                text = text.replace(/\n/g, "\n\n"); 
                text = text.replace(/\n{3,}/g, "\n\n"); 

            } else if (mode === 'break') {
                // 在每個換行前加兩個空白 (Markdown 的 Line Break)
                // 忽略已經是空行的地方
                const lines = text.split('\n');
                const newLines = lines.map(line => {
                    if (line.trim() === '') return ''; // 空行保持空
                    return line + "  "; // 行尾加兩空白
                });
                text = newLines.join('\n');

            } else if (mode === 'merge') {
                // PDF 修復模式：
                // 如果遇到 \n\n (空行)，保留為段落。
                // 如果遇到單個 \n，替換為空白 (接續上一行)。
                
                // 1. 先把真正的段落 (\n\n) 保護起來 (用個特殊字串 placeholder)
                text = text.replace(/\n\s*\n/g, "||PARAGRAPH||");
                
                // 2. 把剩餘的單個換行變空白
                text = text.replace(/\n/g, " ");
                
                // 3. 把 placeholder 變回標準 Markdown 段落
                text = text.replace(/\|\|PARAGRAPH\|\|/g, "\n\n");
            }

            // 3. 處理標題 (簡單啟發式，可選)
            // 如果一行很短且原本沒有標點，或許是標題？(這裡先不自動做，避免誤判)

            outputText.value = text;
            
            // 視覺回饋
            document.getElementById('outputContainer').classList.remove('border-dashed', 'border-gray-300');
            document.getElementById('outputContainer').classList.add('border-solid', 'border-blue-500');
        }

        function copyToClipboard() {
            const copyText = document.getElementById("outputText");
            copyText.select();
            copyText.setSelectionRange(0, 99999); /* 手機版兼容 */
            
            navigator.clipboard.writeText(copyText.value).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.textContent;
                btn.textContent = "已複製！";
                btn.classList.replace('bg-green-500', 'bg-gray-700');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.replace('bg-gray-700', 'bg-green-500');
                }, 2000);
            });
        }

        function clearInput() {
            inputText.value = '';
            outputText.value = '';
            inputText.focus();
        }
    </script>
</body>
</html>
