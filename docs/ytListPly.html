<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>畫冊</title>
    <style>
        * { box-sizing: border-box; } 

        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            width: 100vw; 
            height: 100dvh; 
            margin: 0; 
            padding: 0; 
            background-color: black; 
            color: gray; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        #player-container { 
            width: 100%; 
            flex-grow: 1; 
            transition: all 0.3s ease; /* 讓視窗縮放的過程平滑過渡 */
        }

        /* 網頁內子母畫面 (懸浮視窗) 的樣式 */
        #player-container.pip-mode {
            position: fixed;
            bottom: 80px; /* 避開底部的控制列 */
            right: 20px;
            width: 320px;
            height: 180px;
            flex-grow: 0;
            z-index: 9999;
            border: 2px solid #9aff9b;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            overflow: hidden;
            background: black;
        }

        #player { 
            width: 100%; 
            height: 100%; 
        }

        .controls { 
            width: 100%; 
            background: #111; 
            padding: 10px; 
            display: flex; 
            align-items: center; 
            gap: 10px;
            flex-wrap: wrap; 
            z-index: 10000; /* 確保控制列永遠在最上層 */
        }

        select { 
            padding: 5px; 
            flex-grow: 1; 
            max-width: 150px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            background: #333;
            color: white;
        }

        button { 
            padding: 8px 15px; 
            cursor: pointer; 
            background: rgba(128, 128, 128, 0.658); 
            color: rgba(255, 255, 255, 0.875); 
            border: none; 
            border-radius: 4px; 
            font-weight: bold; 
            white-space: nowrap; 
        }

        button:hover { background: #0058cc; color: white; }

        .info { color: #888; font-size: 14px; margin-left: auto; }
    </style>
</head>
<body>

    <div id="player-container">
        <div id="player"></div>
    </div>

    <div class="controls">
        <select id="videoSelector" >
            <option>正在載入</option>
        </select>
        <button id="playBtn" >🔀 隨機</button>
        <button id="upBtn" >⏮️ 上卷</button>
        <button id="dwonBtn">⏭️ 下卷</button>
        <button id="pipBtn">🔲 微觀</button>
        <button id="IDShow">1213812138</button>

        <div class="info" id="statusText">準備中...</div>
    </div>

    <script src="ytlp.js"></script>
    <script defer src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
