<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="cache-control" content="no-cache" />
    <title></title>
</head>
<body>
    <script>
        function processAndRedirect() {
            const baseUrl = "https://h.jwint.net/chess/chessOne";
            const lastPart = window.location.search.slice(1);
            const result = lastPart.replace(/\+/g, "%20");
            let kk1;
            //console.log("Extracted and processed part:", result);
            if (result) {
                kk1 = `${baseUrl}?${result}`;
            }else{
                kk1 = baseUrl;
            }
            window.location.href = kk1;
            console.log("Redirecting to:", kk1);
            }
        processAndRedirect();
    </script>
</body>
</html>
