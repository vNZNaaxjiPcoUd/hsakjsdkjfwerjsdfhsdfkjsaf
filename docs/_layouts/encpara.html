<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title == "" %}{{ page.name }}{% else %}{{ page.title }}{% endif %}</title>
<link rel="stylesheet" href="https://h.jwint.net/styles_white.css">
</head>
<body>
<div id="mdPart">{{ content }}</div>
<div id="defShow">Nice!</div>

<script src="https://h.jwint.net/static/crypto-js.min.js"></script>
<script defer>
const ENCRYPTED_CONTENT = "{{ page.doc }}";
let para = "";
const cont = `{{ content }}`;

if ( cont === ""){
	document.getElementById("defShow").style.display = "block";
	document.getElementById("mdPart").style.display = "none";
}else{
	document.getElementById("defShow").style.display = "none";
	document.getElementById("mdPart").style.display = "block";
}

function unlock() {
    const input = para;

    if (!input) {
        return;
    }
    console.log(para);
    try {
        const bytes = CryptoJS.AES.decrypt(ENCRYPTED_CONTENT, input);
        const originalHTML = bytes.toString(CryptoJS.enc.Utf8);
		
        if (originalHTML) {  
            document.body.innerHTML = originalHTML;
        } else {
      			console.log("dec fail");
        }
    } catch (e) {
        console.log("catch");
    }
}

const baseK = "BUM7b52CM9kkwslNmhFQFsTUACVLPiWeGZonZc13rbDjezPy1";
function processAndRedirect() {
	const result = window.location.search.slice(1).replace(/\+/g, "%20");
    para = CryptoJS.AES.decrypt(CryptoJS.AES.decrypt(result, baseK).toString(CryptoJS.enc.Utf8), baseK).toString(CryptoJS.enc.Utf8);
    unlock();
}
  
processAndRedirect();

</script>

</body>
</html>
