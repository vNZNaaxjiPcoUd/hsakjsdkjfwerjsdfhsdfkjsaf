<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title == "" %}{{ page.name }}{% else %}{{ page.title }}{% endif %}</title>
<link rel="stylesheet" href="/styles_white.css">
</head>
<body>
<div id="lockScreen">
    <input type="password" id="password" placeholder="here" autocomplete="off" autofocus>
    <button onclick="unlock()">show</button>
</div>

<script src="/static/crypto-js.min.js"></script>
<script>


const ENCRYPTED_CONTENT = "{{ page.lock }}"; 
const srcURL = `{{ page.srcUrl }}`;
  
async function unlock() {
    const input = document.getElementById("password").value;



    if (!input) {
        return;
    }
	console.log(input);
	
    try {
        const bytes = CryptoJS.AES.decrypt(ENCRYPTED_CONTENT, input);
        const originalHTML = bytes.toString(CryptoJS.enc.Utf8);
		console.log(originalHTML);
		
        if (originalHTML) {  
			console.log(srcURL);
			const response = await fetch(srcURL);
			if (!response.ok) {
			  console.log(`無法載入檔案 (HTTP ${response.status})`);
			}
			const markdownText = await response.text();
			const newHTML = converter.makeHtml(markdownText); // 轉換成 HTML
			console.log(newHTML);
			
            document.open();
            document.write(newHTML); // 這裡面的 script 會執行
            document.close();
        } else {
			document.getElementById("password").value = "";
			document.body.innerHTML = "<h2>Hello World!</h2>";
        }
    } catch (e) {
        document.getElementById("password").value = "";
		document.body.innerHTML = "<h2>Hello!</h2>";
    }
}

document.getElementById("password").addEventListener("keypress", async function(e) {
    if (e.key === "Enter") await unlock();
});
</script>

</body>
</html>
