<!DOCTYPE html><html lang="{{ page.lang | default: site.lang | default: "en-US" }}"><head><base target="_blank"><meta charset="UTF-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://h.jwint.net/styles.css"><link rel="manifest" href="https://h.jwint.net/manifest.json"><style> #secretArea { display: none; } .hint { color: #888; font-size: 14px; } #helloWorld { display: block; } /*#helloWorld:hover { transform: scale(1.1); }*/ /* 密碼輸入燈箱 */ #passwordOverlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.95); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 999; } #passwordInput { font-size: 28px; padding: 15px 20px; width: 300px; text-align: center; border: none; border-bottom: 3px solid #00ff88; background: transparent; color: #fff; outline: none; } #passwordInput:focus { border-bottom-color: #00ff88; } .tip { margin-top: 20px; color: #888; font-size: 14px; } </style><title>{% if page.title %}{{ page.title }}{% else %}{{ page.name }}{% endif %}</title></head><body><div id="Start"><div id="keyIn">--</div><div id="msg"></div><div id="passwordOverlay"><input type="password" id="passwordInput" placeholder="訊息內容" autocomplete="off"></div></div><div id="secretArea"> {{ content }} </div><script defer> // password check and show content const PASSWORD = "{{ page.lock }}"; const SALT = "{{ page.salt }}" let buffer = []; const MAX_BUFFER = 99; function cleanBuffer() { buffer = []; } async function hashPassword(password, salt) { const encoder = new TextEncoder(); const data = encoder.encode(password + salt); const hashBuffer = await crypto.subtle.digest('SHA-512', data); const hashArray = new Uint8Array(hashBuffer); const hashHex = Array.from(hashArray).map(byte => byte.toString(16).padStart(2, '0')).join(''); return hashHex; } async function checkPassword(inputPassword, storedSalt, storedHash) { const inputHash = await hashPassword(inputPassword, storedSalt); if (inputHash === storedHash) { return true; } else { return false; } } document.addEventListener("keydown", async function(e) { if (e.key.length === 1) { buffer.push(e.key.toLowerCase()); if (e.key === ' ') { e.preventDefault(); cleanBuffer(); window.scrollTo({ top: 0, behavior: 'smooth' }); updateDisplay(); return; } if (buffer.length > MAX_BUFFER) { buffer.shift(); } if (await checkPassword(buffer.join(""), SALT, PASSWORD)) { document.getElementById("secretArea").style.display = "block"; document.getElementById("Start").style.display = "none"; document.removeEventListener("keydown", arguments.callee); cleanBuffer(); } updateDisplay(); } if (e.key === "Backspace") { buffer.pop(); } }); const msg = document.getElementById("keyIn"); function updateDisplay() { if (buffer.length === 0) { msg.textContent = '-'; return; } //const masked = '•'.repeat(MAX_BUFFER-buffer.length); msg.textContent = buffer[buffer.length - 1]; //msg.textContent = '•'.repeat(MAX_BUFFER); } msg.onclick = function() { document.getElementById("passwordOverlay").style.display = "flex"; document.getElementById("passwordInput").focus(); this.style.display = "none"; cleanBuffer(); }; document.getElementById("passwordInput").onkeydown = async function(e) { if (e.key === "Enter") { if (await checkPassword(this.value, SALT, PASSWORD)) { document.getElementById("secretArea").style.display = "block"; document.getElementById("Start").style.display = "none"; } else { this.style.borderBottomColor = "#ff0088"; this.value = ""; this.placeholder = "訊息已送出！"; cleanBuffer(); } } }; updateDisplay(); </script><script defer> // show temp page , use innerHTML to replace iframe. async function showPage(srcURL, divN) { const response = await fetch(srcURL); if (!response.ok) { //console.log(`無法載入檔案 (HTTP ${response.status})`); } const newHTML = await response.text(); document.getElementById(divN).innerHTML = newHTML; } showPage("https://h.jwint.net/%E4%B9%BE%E7%87%A5%E5%8A%91%E3%80%80%E6%B0%AF%E5%8C%96%E9%88%A3.html", "msg"); </script></body></html>
