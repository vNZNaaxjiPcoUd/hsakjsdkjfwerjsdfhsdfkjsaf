<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://h.jwint.net/styles.css">
<link rel="manifest" href="https://h.jwint.net/manifest.json">
<title>Gogo!</title>
</head>
<body>
<div id="lockScreen">
    <input type="password" id="password" placeholder="here is" autocomplete="off" autofocus>
    <br>
    <button onclick="unlock()">show</button>
</div>
{{ content }}

<script src="https://h.jwint.net/static/crypto-js.min.js"></script>
<script>

const ENCRYPTED_CONTENT = "{{ page.key }}"; 
let baseUrl = "";
const salt = "Wi2Vr6gnT1pnrqF2Mr9D8e9q3ETAceTK3UXV61sOPyodhoNCdarl6";
	
function processAndRedirect() {
    
    const lastPart = window.location.search.slice(1);
    const result = lastPart.replace(/\+/g, "%20");
    const kk1 = `${baseUrl}${result}`;
    let okU = kk1.replace(/(?<!:)\/+/g, "/");
    window.location.href = okU;
}

function unlock() {
    const input = document.getElementById("password").value;
    if (!input) {
        return;
    }
    try {
		const aa = input+salt ; 
        const bytes = CryptoJS.AES.decrypt(ENCRYPTED_CONTENT, aa);
        const originalHTML = bytes.toString(CryptoJS.enc.Utf8);
		//console.log(originalHTML);
        if (originalHTML) {  
            //document.body.innerHTML = originalHTML;
			baseUrl=originalHTML;
			processAndRedirect();
        } else {
            //throw new Error();
			document.getElementById("password").value = "";
			document.body.innerHTML = "<h2>Hello World!</h2>";
        }
    } catch (e) {
        document.getElementById("password").value = "";
		document.body.innerHTML = "<h2>Hello!</h2>";
    }
}

document.getElementById("password").addEventListener("keypress", function(e) {
    if (e.key === "Enter") unlock();
});

</script>

</body>
</html>
