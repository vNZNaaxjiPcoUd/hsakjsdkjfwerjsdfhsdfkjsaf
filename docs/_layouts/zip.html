<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title == "" %}{{ page.name }}{% else %}{{ page.title }}{% endif %}</title>
<link rel="stylesheet" href="/styles_white.css">
</head>
<body>
<div id="lockScreen">
	<h2>
    <p>Allo</p>
    <input type="password" id="password" placeholder="here is" autocomplete="off" autofocus>
    <br>
    <button onclick="unlock()">show</button>
	</h2>
</div>

<!--- <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script> --->
<script src="/static/crypto-js.min.js"></script>
<script>

const ENCRYPTED_CONTENT = "{{ page.zip }}"; 

function unlock() {
    const input = document.getElementById("password").value;

    if (!input) {
        return;
    }

    try {
        const bytes = CryptoJS.AES.decrypt(ENCRYPTED_CONTENT, input);
        const originalHTML = bytes.toString(CryptoJS.enc.Utf8);
		//console.log(originalHTML);
        if (originalHTML) {  
            document.body.innerHTML = originalHTML;
        } else {
            //throw new Error();
			document.getElementById("password").value = "";
			document.body.innerHTML = "<h2>Hello World!</h2>";
        }
    } catch (e) {
        document.getElementById("password").value = "";
		document.body.innerHTML = "<h2>Hello!</h2>";
    }
}

document.getElementById("password").addEventListener("keypress", function(e) {
    if (e.key === "Enter") unlock();
});
</script>

</body>
</html>
