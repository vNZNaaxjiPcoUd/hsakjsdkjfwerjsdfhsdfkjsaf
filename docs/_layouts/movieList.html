<!DOCTYPE html>
<html>
<head>
	<base target="_blank">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	  <link rel="stylesheet" href="/styles.css">
	  <link rel="manifest" href="/manifest.json">
    <title>{% if page.title == "" %}{{ page.name }}{% else %}{{ page.title }}{% endif %}</title>
</head>
<body  class="mono">
	<iframe style="width:100%; height:100vh; border:none; margin:0; padding:0; display:block;" src="https://www.youtube.com/embed/{{ page.song }}?loop=1&playlist={{ page.list }}&autoplay=1" 
	title="Song" frameborder="0" 
	allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
	referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
	<div class="container-lg px-3 my-5 markdown-body">
		{{ content }}
	</div>
</body>
</html>
